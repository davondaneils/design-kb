<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bad tokens fixture</title>
<!-- Each block reproduces one class the round 4 critic caught by eye (kb/reviews/round4-critic.md). Expected lint fails:
     undefined-var (the meter fill and ring use --color-warning-mark, declared nowhere), state-layer (a raw 4 percent
     hover and a --state-hover of 4 percent), double-space (a flex gap plus a leading no-break space, the same inside a card tilted 0.6deg, and two
     spaces in a row), truth (a caveat whose data-explained-by alert is hidden), proportion (a 78 percent meter that paints nothing). -->
<style>
  :root { color-scheme: light; --color-bg: #ffffff; --color-text: #1d1d1f; --color-muted: #5c5f66; --color-primary: #1f5fd1; --color-warning: #8a5a00; --color-surface: #ffffff;
    --state-hover: color-mix(in oklch, var(--color-text) 4%, transparent); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 31px; line-height: 1.2; margin: 0 0 24px; }
  p { margin: 0 0 16px; max-inline-size: 52ch; }
  .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #8a8d93; border-radius: 8px; background: var(--color-surface); color: var(--color-text); font: inherit; }
  .opt:hover { background: color-mix(in oklch, var(--color-text) 4%, var(--color-surface)); }
  .usage { display: grid; gap: 8px; width: 240px; padding: 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--color-warning-mark); }
  .meter { display: block; height: 4px; border-radius: 9999px; background: #e4e5e7; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 78%; background: var(--color-warning-mark); }
  .alert { padding: 12px; border: 1px solid #8a8d93; border-radius: 8px; }
  .alert[hidden] { display: none; }
  .caveat { font-size: 14px; color: var(--color-muted); }
  .card { rotate: -0.6deg; padding: 16px; }
  .tick { display: inline-flex; align-items: center; gap: 12px; min-height: 44px; }
</style></head>
<body><main>
  <h1>Bad tokens fixture</h1>
  <p><button class="btn" type="button">Invite<span>&nbsp;a teammate</span></button></p>
  <p>Two spaces&nbsp; in a row.</p>
  <div class="card"><label class="tick"><input type="checkbox">10&nbsp;<span style="white-space: nowrap">push-ups</span></label></div>
  <p><button class="btn opt" type="button">Pour-over</button></p>
  <div class="usage"><span>Events this month</span><span class="meter" role="meter" aria-label="Events this month" aria-valuemin="0" aria-valuemax="10000000" aria-valuenow="7800000" aria-valuetext="7.8 million of 10 million"><i></i></span><span>7.8M of 10M</span></div>
  <p>Revenue <span class="caveat" data-explained-by="#alert-checkout">Partial since 2:05&nbsp;pm</span></p>
  <div class="alert" id="alert-checkout" hidden>Checkout events stopped at 2:05&nbsp;pm.</div>
</main></body></html>

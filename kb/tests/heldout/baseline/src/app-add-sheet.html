<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ebb · Add transaction</title>
<style>
/*@FONTS Inter=inter.woff2;100 900;normal*/
/*@INCLUDE app.css*/
.behind{position:absolute;inset:0;overflow:hidden}
.behind .ghost{padding:60px 20px;opacity:.9}
.ghost .g1{height:30px;width:60%;border-radius:8px;background:var(--surface-2);margin-bottom:20px}
.ghost .g2{height:230px;border-radius:20px;background:var(--surface);margin-bottom:12px}
.ghost .g3{height:110px;border-radius:20px;background:var(--surface)}
.scrim{position:absolute;inset:0;background:rgba(10,12,16,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;padding:8px 20px 34px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px}
.head h1{font-size:17px;font-weight:600}
.head .x{justify-self:start;color:var(--accent);font-weight:500;font-size:17px;padding:10px 0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px;margin:12px 0 0}
.seg button{height:38px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{text-align:center;padding:26px 0 18px}
.amount .v{font-size:56px;font-weight:700;letter-spacing:-.035em;line-height:1}
.amount .v .c{color:var(--muted);font-weight:600;font-size:.6em;vertical-align:.4em;margin-right:4px}
.amount .v .caret{display:inline-block;width:2px;height:.8em;background:var(--accent);vertical-align:-.05em;margin-left:2px}
.amount p{font-size:14px;color:var(--muted);margin-top:8px}
.fields{border-radius:16px;background:var(--surface-2);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;font-size:16px}
.row+.row{border-top:1px solid var(--line)}
.row span:first-child{color:var(--muted)}
.row .v{font-weight:500;display:flex;align-items:center;gap:6px}
.taxrow{margin-top:12px;background:var(--tax-soft);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.taxrow > div:first-child{flex:1}
.taxrow b{display:block;font-weight:600;font-size:15px}
.taxrow span{font-size:13px;color:var(--muted)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--accent);position:relative;flex:none}
.switch::after{content:"";position:absolute;right:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.save{margin-top:auto}
</style>
</head>
<body>
<div class="screen">
<div class="behind" aria-hidden="true">
/*@INCLUDE status.html*/
<div class="ghost"><div class="g1"></div><div class="g2"></div><div class="g3"></div></div>
</div>
<div class="scrim" aria-hidden="true"></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="t">
  <div class="grab" aria-hidden="true"></div>
  <div class="head"><button class="x">Cancel</button><h1 id="t">New transaction</h1><span></span></div>
  <div class="seg" role="group" aria-label="Type"><button aria-pressed="true">Income</button><button aria-pressed="false">Expense</button></div>
  <div class="amount">
    <div class="v num" aria-label="Amount £1,250.00"><span class="c">£</span>1,250.00<span class="caret"></span></div>
    <p>Tax set-aside will rise to <b class="num" style="color:var(--text)">£2,724.50</b></p>
  </div>
  <div class="fields">
    <div class="row"><span>From</span><span class="v">Halden Studio <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" opacity=".4"><path d="m1 1 5.5 5.5L1 12"/></svg></span></div>
    <div class="row"><span>Category</span><span class="v">Client work <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" opacity=".4"><path d="m1 1 5.5 5.5L1 12"/></svg></span></div>
    <div class="row"><span>Date</span><span class="v num">Today, 11 Oct</span></div>
    <div class="row"><span>Note</span><span class="v" style="color:var(--muted)">Optional</span></div>
  </div>
  <div class="taxrow">
    <div><b>Set aside 25% for tax</b><span class="num">£312.50 moves to your tax pot</span></div>
    <div class="switch" role="switch" aria-checked="true" aria-label="Set aside 25% for tax"></div>
  </div>
  <button class="btn btn-primary save">Add income</button>
</section>
</div>
</body>
</html>

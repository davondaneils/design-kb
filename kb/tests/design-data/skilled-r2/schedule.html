const NB = ' ';
const timeFmt = new Intl.DateTimeFormat(LANG, { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
const dateFmt = new Intl.DateTimeFormat(LANG, { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });

const localDate = (iso) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso));

function clock(h, m) {               // 24-hour wall parts to "7 pm" / "6:30 pm"
  const ap = h < 12 ? 'am' : 'pm';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return { num: m ? `${h12}:${String(m).padStart(2, '0')}` : String(h12), ap };
}
function instantClock(iso) {         // an instant, in the location zone
  const p = Object.fromEntries(timeFmt.formatToParts(new Date(iso)).map((x) => [x.type, x.value]));
  const h = Number(p.hour) % 12 + (p.dayPeriod === 'PM' ? 12 : 0);
  const c = clock(h, Number(p.minute));
  return c.num + NB + c.ap;
}
function wallParts(local) { const [d, t] = local.split('T'); const [h, m] = t.split(':').map(Number); return { d, h, m }; }
function wallRange(a, b) {           // "7 to 8:30 pm", "11 am to 12:30 pm"
  const s = wallParts(a), e = wallParts(b);
  const cs = clock(s.h, s.m), ce = clock(e.h, e.m);
  return cs.ap === ce.ap ? `${cs.num} to ${ce.num}${NB}${ce.ap}` : `${cs.num}${NB}${cs.ap} to ${ce.num}${NB}${ce.ap}`;
}
function wallClock(local) { const s = wallParts(local); const c = clock(s.h, s.m); return c.num + NB + c.ap; }
const nbsp = (s) => s.replace(/ /g, NB);
const zoneName = (iso) => new Intl.DateTimeFormat(LANG, { timeZone: TZ, timeZoneName: 'longGeneric' }).formatToParts(new Date(iso)).find((x) => x.type === 'timeZoneName').value;
function closedText(iso, today) {    // "at 7 am today" or "on Fri, Oct 16 at 6 am"
  return localDate(iso) === today ? `at ${instantClock(iso)} today` : `on ${instantDate(iso)} at ${instantClock(iso)}`;
}
function dayLabel(dateStr) { return nbsp(dayOnlyFmt.format(new Date(dateStr + 'T00:00:00Z'))); }  // date-only: UTC, never local
function instantDate(iso) { return nbsp(dateFmt.format(new Date(iso))); }
function whenText(iso, today) {      // "today, 7 am" or "Fri, Oct 16, 6 am"
  return localDate(iso) === today ? `today, ${instantClock(iso)}` : `${instantDate(iso)}, ${instantClock(iso)}`;
}
function weekRange(start, endExcl) {
  const s = new Date(start + 'T00:00:00Z'), e = new Date(new Date(endExcl + 'T00:00:00Z').getTime() - 864e5);
  const sameMonth = s.getUTCMonth() === e.getUTCMonth();
  return nbsp(monthDayFmt.format(s)) + ' to' + NB + (sameMonth ? dayNumFmt.format(e) : nbsp(monthDayFmt.format(e)));
}
const ordinal = (n) => n + ({ one: 'st', two: 'nd', few: 'rd', other: 'th' })[new Intl.PluralRules(LANG, { type: 'ordinal' }).select(n)];
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function statusTag(c, r) {

function reasonText(reason, reasonAt, r) {
  switch (reason) {
    case 'grace_ends_before_class': return `This class starts after your payment grace ends (${whenText(reasonAt, r.today)}), so it can be booked once your payment goes through.`;
    case 'no_pass': return `You need a pass at ${r.location.gym_name} to book classes.`;
    case 'no_credits_left': return 'Your class pack has no classes left.';
    case 'payment_required': return 'Your pass is not active. Update your payment to book.';

      <h2 id="mine-h">${parts.join(', ')}</h2><ul class="mine">${items}</ul></section>`;
  }
  if (p && p.status === 'past_due') { $('banner').innerHTML = pass; side.innerHTML = next; }
  else { $('banner').innerHTML = ''; side.innerHTML = next + pass; }
}

function render(given) {
  const thisWeek = STATE !== 'empty';
  $('tab-this').toggleAttribute('aria-current', false); $('tab-next').toggleAttribute('aria-current', false);
  (thisWeek ? $('tab-this') : $('tab-next')).setAttribute('aria-current', 'page');
  const body = $('week-body');

  if (STATE === 'loading') {
    document.querySelector('#week').setAttribute('aria-busy', 'true');
    $('week-meta').textContent = 'Loading classes';
    $('side').innerHTML = `<section class="card" aria-hidden="true"><div class="stack-md"><div class="sk w25"></div><div class="sk w60"></div><div class="sk w80"></div></div></section>`;
    body.innerHTML = `<div class="classes" aria-hidden="true">${'<div class="sk-row"><div class="sk w25"></div><div class="sk w60"></div><div class="sk w40"></div></div>'.repeat(5)}</div>`;
    return;
  }
  if (STATE === 'error') {
    $('week-meta').textContent = '';
    $('side').innerHTML = '';
    body.innerHTML = `<div class="panel" role="alert"><span class="glyph">${icon('wifi')}</span><h3>Classes didn’t load</h3>
      <p>Check your connection, then try again. Nothing you booked has changed.</p>
      <a class="btn btn-primary" href="?state=ready">Try again</a></div>`;
    return;
  }

  const r = given || response(STATE);
  $('week-title').textContent = weekRange(r.query.week_start, r.query.week_end);
  $('week-meta').textContent = `Times in ${zoneName(r.as_of)}${r.data.length ? `. Places as of ${instantClock(r.as_of)}` : ''}`;
  renderSide(r);

  if (!r.data.length) {
    const n = r.summary.next_class_starts_local;
    body.innerHTML = `<div class="panel" data-data="none"><span class="glyph">${icon('calendar')}</span><h3>No classes at ${r.location.name} from ${weekRange(r.query.week_start, r.query.week_end)}</h3>
      <p>${n ? `The next class is on ${dayLabel(wallParts(n).d)} at ${wallClock(n)}.` : 'Nothing is scheduled yet.'}</p>
      <a class="btn btn-secondary" href="?state=ready">Back to this week</a></div>`;
    return;
  }

  const groups = new Map();
  for (const c of r.data) { const d = wallParts(c.starts_local).d; if (!groups.has(d)) groups.set(d, []); groups.get(d).push(c); }
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(Date.parse(r.query.week_start + 'T00:00:00Z') + i * 864e5).toISOString().slice(0, 10);
    const list = groups.get(d) || [];
    const label = d === r.today ? `<span class="today">Today</span><span>${dayLabel(d)}</span>` : `<span>${dayLabel(d)}</span>`;
    const rows = list.map((c) => {
      const open = r.expanded === c.class_id;
      const cls = ['cls', c.has_started ? 'past' : '', c.class_status === 'cancelled' ? 'cancelled' : ''].join(' ').trim();
      return `<li class="${cls}" id="${c.class_id}">
        <button class="row" aria-expanded="${open}" aria-controls="${c.class_id}-d" data-toggle="${c.class_id}">
          <span class="stack-sm"><span class="t">${wallRange(c.starts_local, c.ends_local)}</span><span class="n">${c.class_type}</span><span class="who">with ${c.instructor_name}</span></span>
          <span class="end">${statusTag(c, r)}<svg class="i chev" viewBox="0 0 16 16" aria-hidden="true">${ICON.chev}</svg></span>
        </button>
        <div class="detail" id="${c.class_id}-d" ${open ? '' : 'hidden'}>${detail(c, r)}</div></li>`;
    }).join('');
    days.push(`<li class="day"><h3>${label}</h3>${list.length ? `<ul class="classes">${rows}</ul>` : `<p class="none classes">No classes</p>`}</li>`);
  }
  body.innerHTML = `<ol class="days">${days.join('')}</ol>`;
  window.__r = r;
}

/* Interactions: one class open at a time; actions show the server's answer. In this mock the answer is the
   fixture's next state, applied to every related number at once (taken, left, waiting, your week). */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-toggle], [data-act], [data-open]');
  if (!t) return;
  const r = window.__r;
  if (t.dataset.open) {
    const row = document.querySelector(`[data-toggle="${t.dataset.open}"]`);
    if (row && row.getAttribute('aria-expanded') !== 'true') row.click();
    return;
  }
  if (t.dataset.toggle) {
    const id = t.dataset.toggle, open = t.getAttribute('aria-expanded') === 'true';
    document.querySelectorAll('.row[aria-expanded="true"]').forEach((b) => { b.setAttribute('aria-expanded', 'false'); $(b.dataset.toggle + '-d').hidden = true; });
    if (!open) { t.setAttribute('aria-expanded', 'true'); $(id + '-d').hidden = false; }
    return;
  }
  const say = (msg) => { $('live').textContent = msg; };
  if (t.dataset.act === 'billing') { say('Opening the secure payment page.'); return; }
  if (t.dataset.act === 'passes') { say('Opening passes.'); return; }
  const id = t.dataset.id, c = r && r.data.find((x) => x.class_id === id);
  if (!c) return;
  const when = `${dayLabel(wallParts(c.starts_local).d)}, ${wallClock(c.starts_local)}`;
  switch (t.dataset.act) {
    case 'book': c.taken += 1; c.places_left -= 1; c.my_booking = { id: 'new', status: 'booked', waitlist_position: null, covered: true }; r.summary.my_upcoming_booked += 1; say(`Booked: ${c.class_type}, ${when}.`); break;
    case 'waitlist': c.waitlist_count += 1; c.my_booking = { id: 'new', status: 'waitlisted', waitlist_position: c.waitlist_count, covered: true }; r.summary.my_waitlisted += 1; say(`You’re ${ordinal(c.waitlist_count)} in line for ${c.class_type}, ${when}.`); break;
    case 'cancel': c.taken -= 1; c.places_left += 1; c.my_booking = null; r.summary.my_upcoming_booked -= 1; say(`Cancelled: ${c.class_type}, ${when}. No charge.`); break;
    case 'leave': c.waitlist_count -= 1; c.my_booking = null; r.summary.my_waitlisted -= 1; say(`You left the waitlist for ${c.class_type}, ${when}.`); break;
    case 'late': $(id + '-confirm').hidden = false; $(id + '-actions').hidden = true; $(id + '-confirm').querySelector('[data-act="late-no"]').focus(); return;
    case 'late-no': $(id + '-confirm').hidden = true; $(id + '-actions').hidden = false; $(id + '-actions').querySelector('button').focus(); return;
    case 'late-yes':
      if (c.waitlist_count > 0) { c.waitlist_count -= 1; } else { c.taken -= 1; c.places_left += 1; }
      c.my_booking = null; r.summary.my_upcoming_booked -= 1; say(`Cancelled: ${c.class_type}, ${when}. Counted as a no-show.`); break;
    default: return;
  }
  // re-render from the updated response so every related number changes in the same frame
  r.expanded = id;
  render(r);
  const row = document.querySelector(`[data-toggle="${id}"]`); if (row) row.focus();
});

render();
</script>
</body>
</html>

<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Crux Class Schedule</title>
<style>
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #efede8;
  --text: #1b1a17;
  --text-2: #5a564e;
  --border: #e0ddd5;
  --border-strong: #c9c5bb;
  --accent: #b5410e;
  --accent-text: #ffffff;
  --accent-soft: #fbeee6;
  --ok: #1d6f46;
  --ok-soft: #e4f3ea;
  --warn: #85500a;
  --warn-soft: #fcf0d9;
  --danger: #b42318;
  --danger-soft: #fdecea;
  --wait: #4338ca;
  --wait-soft: #eceeff;
  --skeleton: #e7e4dd;
  --focus: #1d4ed8;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(27, 26, 23, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121110;
    --surface: #1c1b19;
    --surface-2: #26241f;
    --text: #f2efe9;
    --text-2: #aaa49a;
    --border: #322f2a;
    --border-strong: #48443d;
    --accent: #f08a4b;
    --accent-text: #1a0d05;
    --accent-soft: #2e1c11;
    --ok: #63cf93;
    --ok-soft: #14271c;
    --warn: #f3b552;
    --warn-soft: #2a2011;
    --danger: #ff8f80;
    --danger-soft: #2d1512;
    --wait: #a9b5ff;
    --wait-soft: #1d1f38;
    --skeleton: #2a2824;
    --focus: #8ab4ff;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* App frame */
.app { max-width: 1360px; margin: 0 auto; padding: 0 16px 24px; min-height: calc(100vh - 62px); }
.top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 0 10px;
}
.gym { display: flex; flex-direction: column; min-width: 0; }
.gym-name { font-size: 13px; color: var(--text-2); }
.loc-btn {
  display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none;
  font-size: 22px; font-weight: 700; letter-spacing: -.01em; cursor: pointer; min-height: 32px;
}
.loc-btn svg { width: 18px; height: 18px; color: var(--text-2); }
.pass {
  display: inline-flex; flex-direction: column; align-items: flex-end; text-align: right;
  font-size: 13px; line-height: 1.3; flex-shrink: 0;
}
.pass b { font-weight: 600; }
.pass span { color: var(--text-2); }
.pass.bad b { color: var(--danger); }

.week-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 0 12px;
}
.week-title { font-size: 15px; font-weight: 600; }
.week-sub { font-size: 13px; color: var(--text-2); }
.nav-btns { display: flex; gap: 4px; }
.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; }

/* Banner */
.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; margin: 0 0 14px;
  border-radius: var(--radius); background: var(--danger-soft); color: var(--text);
  border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
}
.banner svg { flex-shrink: 0; width: 20px; height: 20px; color: var(--danger); margin-top: 1px; }
.banner-body { flex: 1; min-width: 0; }
.banner-title { font-weight: 600; }
.banner p { margin: 2px 0 10px; color: var(--text-2); font-size: 14px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid transparent;
  font-weight: 600; font-size: 15px; cursor: pointer; white-space: nowrap;
}
.btn-primary { background: var(--accent); color: var(--accent-text); }
.btn-secondary { background: var(--surface); border-color: var(--border-strong); }
.btn-danger { background: var(--danger); color: #fff; }
@media (prefers-color-scheme: dark) { .btn-danger { color: #1b0a08; } }
.btn-quiet { background: none; padding: 0 4px; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.btn[disabled] { opacity: 1; background: var(--surface-2); color: var(--text-2); border-color: var(--border); cursor: not-allowed; }

/* Day strip (mobile) */
.days {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0 10px;
}
.day-tab {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 0 6px;
  border: 1px solid transparent; border-radius: 10px; background: none; cursor: pointer; min-height: 56px;
}
.day-tab .dow { font-size: 12px; color: var(--text-2); }
.day-tab .dnum { font-size: 17px; font-weight: 600; }
.day-tab .marks { display: flex; gap: 3px; height: 6px; }
.day-tab .marks i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.marks .m-booked { background: var(--ok); }
.marks .m-wait { background: var(--wait); }
.day-tab[aria-pressed="true"] { background: var(--text); border-color: var(--text); }
.day-tab[aria-pressed="true"] .dow, .day-tab[aria-pressed="true"] .dnum { color: var(--bg); }
.day-tab.is-today:not([aria-pressed="true"]) { border-color: var(--border-strong); }
.day-tab.is-past:not([aria-pressed="true"]) .dnum { color: var(--text-2); font-weight: 500; }

/* Day columns */
.week { display: block; }
.day { display: none; }
.day.is-selected { display: block; }
.day-head { display: none; }
.day-empty { color: var(--text-2); font-size: 14px; padding: 20px 4px; }
.mobile-day-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 2px 2px 8px; text-transform: uppercase; letter-spacing: .04em; }

/* Class card */
.card {
  position: relative; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 14px 12px; margin-bottom: 10px; box-shadow: var(--shadow);
}
.card.mine-booked { border-color: color-mix(in srgb, var(--ok) 55%, var(--border)); box-shadow: inset 4px 0 0 var(--ok); }
.card.mine-wait { border-color: color-mix(in srgb, var(--wait) 45%, var(--border)); box-shadow: inset 4px 0 0 var(--wait); }
.card.is-done { background: transparent; box-shadow: none; }
.card.is-done .c-title, .card.is-done .c-time { color: var(--text-2); }
.c-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.c-time { font-size: 15px; font-weight: 600; }
.c-dur { font-size: 13px; color: var(--text-2); }
.c-title { font-size: 17px; font-weight: 650; margin: 2px 0 1px; letter-spacing: -.005em; }
.c-meta { font-size: 13px; color: var(--text-2); }
.c-cancelled .c-time, .c-cancelled .c-title { text-decoration: line-through; color: var(--text-2); }
.c-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.c-status { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 14px; }
.c-note { font-size: 13px; color: var(--text-2); }
.c-note.warn { color: var(--warn); }
.places { font-weight: 600; }
.places.low { color: var(--warn); }
.places.full { color: var(--text-2); }
.meter { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.meter i { display: block; height: 100%; background: var(--text-2); border-radius: 2px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; align-self: flex-start;
  font-size: 13px; font-weight: 600; padding: 3px 8px; border-radius: 6px; line-height: 1.35;
}
.badge svg { width: 14px; height: 14px; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-wait { background: var(--wait-soft); color: var(--wait); }
.b-muted { background: var(--surface-2); color: var(--text-2); }
.b-danger { background: var(--danger-soft); color: var(--danger); }
.b-warn { background: var(--warn-soft); color: var(--warn); }

/* Empty and loading */
.empty {
  text-align: center; padding: 48px 20px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.empty svg { width: 40px; height: 40px; color: var(--text-2); }
.empty h2 { font-size: 18px; margin: 12px 0 4px; }
.empty p { margin: 0 auto 18px; color: var(--text-2); max-width: 34ch; }
.empty .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.sk { background: var(--skeleton); border-radius: 6px; }
.sk-card { height: 132px; border-radius: var(--radius); margin-bottom: 10px; }
@media (prefers-reduced-motion: no-preference) {
  .sk { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
}

/* Bottom nav (mobile) */
.tabbar {
  position: sticky; bottom: 0; z-index: 3; display: flex; justify-content: space-around;
  background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  backdrop-filter: blur(10px);
}
.tabbar a {
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; min-height: 44px;
  font-size: 12px; color: var(--text-2); text-decoration: none; padding-top: 4px;
}
.tabbar a[aria-current="page"] { color: var(--text); font-weight: 600; }
.tabbar svg { width: 22px; height: 22px; }

/* Dialog */
dialog {
  border: 0; border-radius: 16px; padding: 20px; width: min(420px, calc(100vw - 32px));
  background: var(--surface); color: var(--text); box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
dialog::backdrop { background: rgba(10, 10, 9, .5); }
dialog h2 { font-size: 18px; margin: 0 0 6px; }
dialog p { margin: 0 0 8px; color: var(--text-2); }
dialog .consequence { padding: 10px 12px; border-radius: 10px; margin: 12px 0 16px; font-size: 14px; }
dialog .consequence.free { background: var(--ok-soft); color: var(--text); }
dialog .consequence.late { background: var(--warn-soft); color: var(--text); }
dialog .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 4;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  max-width: calc(100vw - 32px);
}

/* Desktop: full week grid */
@media (min-width: 900px) {
  .app { padding: 0 32px 48px; }
  .top { padding: 28px 0 8px; }
  .loc-btn { font-size: 28px; }
  .pass { font-size: 14px; }
  .week-bar { padding: 8px 0 20px; }
  .week-title { font-size: 17px; }
  .days, .tabbar, .mobile-day-title { display: none; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .day, .day.is-selected { display: block; min-width: 0; }
  .day-head {
    display: flex; align-items: baseline; gap: 6px; padding: 0 2px 10px; margin-bottom: 10px;
    border-bottom: 2px solid var(--border);
  }
  .day-head .dow { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  .day-head .dnum { font-size: 20px; font-weight: 700; }
  .day-head .today-tag { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--accent); }
  .day.is-today .day-head { border-bottom-color: var(--accent); }
  .day.is-past .day-head .dnum { color: var(--text-2); font-weight: 500; }
  .card { padding: 12px 12px 10px; }
  .c-title { font-size: 15px; }
  .c-row { flex-wrap: wrap; row-gap: 0; }
  .c-foot { flex-direction: column; align-items: stretch; gap: 10px; }
  .c-foot .btn { width: 100%; min-height: 40px; }
  .day-empty { padding: 8px 2px; font-size: 13px; }
  .banner { align-items: center; }
  .banner p { margin-bottom: 0; }
  .banner-body { display: flex; align-items: center; gap: 16px; justify-content: space-between; }
  .toast { bottom: 32px; }
}
</style>
</head>
<body>
<div class="app" id="app" aria-live="polite"></div>
<nav class="tabbar" aria-label="Main">
  <a href="#" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Schedule</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v16l-6-4-6 4z"/></svg>My classes</a>
  <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/></svg>Pass</a>
</nav>
<dialog id="confirm" aria-labelledby="confirm-title"></dialog>

<script>
(() => {
  /* ------------------------------------------------------------------
     Demo data. Shapes match GET /schedule in api.md. Instants are UTC;
     everything on screen is formatted in the location's IANA zone.
  ------------------------------------------------------------------ */
  const TZ = 'Europe/London';
  const SERVER_NOW = new Date('2026-10-13T08:40:00Z');   // Tue 13 Oct, 09:40 in Leeds
  const WEEK_START = '2026-10-12';
  const L = (d, hm) => new Date(`2026-10-${d}T${hm}:00+01:00`); // BST helper for building fixtures only
  const addMin = (date, m) => new Date(date.getTime() + m * 60000);

  const base = [
    // id, day, start, minutes, type, level, instructor, capacity, booked, waitlist, status, reason
    ['s01', 12, '07:00', 90,  'Intro to Bouldering',  'Beginner',     'Priya', 10, 6, 0],
    ['s02', 12, '18:00', 90,  'Intro to Bouldering',  'Beginner',     'Priya', 10, 10, 0],
    ['s03', 12, '19:00', 120, 'Lead Climbing Course', 'Intermediate', 'Tom',   8, 8, 0],
    ['s04', 13, '07:00', 90,  'Intro to Bouldering',  'Beginner',     'Sam',   10, 4, 0],
    ['s05', 13, '18:30', 90,  'Intro to Bouldering',  'Beginner',     'Priya', 10, 7, 0],
    ['s06', 13, '19:00', 120, 'Lead Climbing Course', 'Intermediate', 'Tom',   8, 8, 3],
    ['s07', 14, '16:30', 90,  'Youth Club',           'Ages 8 to 14', 'Amara', 12, 9, 0],
    ['s08', 14, '18:00', 90,  'Intro to Bouldering',  'Beginner',     'Priya', 10, 10, 3],
    ['s09', 15, '18:30', 90,  'Intro to Bouldering',  'Beginner',     'Sam',   10, 7, 0],
    ['s10', 15, '19:00', 120, 'Lead Climbing Course', 'Intermediate', 'Tom',   8, 8, 0],
    ['s11', 16, '16:30', 90,  'Youth Club',           'Ages 8 to 14', 'Amara', 12, 0, 0, 'cancelled', 'Instructor unwell'],
    ['s12', 16, '18:00', 90,  'Intro to Bouldering',  'Beginner',     'Priya', 10, 2, 0],
    ['s13', 17, '10:00', 90,  'Youth Club',           'Ages 8 to 14', 'Amara', 12, 12, 5],
    ['s14', 17, '10:30', 90,  'Intro to Bouldering',  'Beginner',     'Sam',   10, 9, 0],
    ['s15', 17, '14:00', 120, 'Lead Climbing Course', 'Intermediate', 'Tom',   8, 5, 0],
    ['s16', 18, '10:00', 90,  'Intro to Bouldering',  'Beginner',     'Priya', 10, 1, 0],
  ];

  function sessions() {
    return base.map(([id, d, hm, min, type, level, ins, cap, booked, wait, status, reason]) => {
      const starts = L(d, hm);
      return {
        session_id: id, class_type: { name: type, level }, instructor_name: ins,
        starts_at: starts.toISOString(), ends_at: addMin(starts, min).toISOString(),
        status: status || 'scheduled', cancel_reason: reason || null,
        capacity: cap, booked_count: booked, waitlist_count: wait, my_booking: null,
      };
    });
  }

  const passActive = { kind: 'monthly_pass', plan_name: 'Monthly Unlimited', status: 'active',
    current_period_end: '2026-11-02T09:00:00Z', grace_until: null, credits_left: null };

  function scenario(state) {
    const list = sessions();
    const by = id => list.find(s => s.session_id === id);
    by('s02').my_booking = { id: 'b-att', status: 'attended', waitlist_position: null, free_cancel_until: '2026-10-12T05:00:00Z' };
    const book = (id) => {
      const s = by(id);
      s.my_booking = { id: 'b-' + id, status: 'booked', waitlist_position: null,
        free_cancel_until: new Date(new Date(s.starts_at).getTime() - 12 * 3600e3).toISOString() };
    };
    const wait = (id, pos) => { by(id).my_booking = { id: 'b-' + id, status: 'waitlisted', waitlist_position: pos, free_cancel_until: null }; };

    const d = { location: { id: 'loc-kirkstall', name: 'Kirkstall', timezone: TZ }, gym: 'Granite Works',
      week_start: WEEK_START, server_time: SERVER_NOW.toISOString(), entitlement: passActive,
      data: list, next_scheduled_at: null, focus: '2026-10-13' };

    switch (state) {
      case 'available': d.focus = '2026-10-13'; break;
      case 'waitlist': wait('s08', 2); d.focus = '2026-10-14'; break;
      case 'booked': book('s09'); d.focus = '2026-10-15'; break;
      case 'late': book('s05'); d.focus = '2026-10-13'; break;
      case 'past_due':
        book('s09');
        d.entitlement = { ...passActive, status: 'past_due', payment_failed_at: '2026-10-10T07:15:00Z', grace_until: '2026-10-17T07:15:00Z' };
        d.focus = '2026-10-17'; break;
      case 'empty':
        d.data = []; d.next_scheduled_at = '2026-10-19T06:00:00Z'; d.focus = '2026-10-13'; break;
      default: book('s09'); wait('s08', 2); d.focus = '2026-10-13';
    }
    return d;
  }

  /* ------------------------------------------------------------------
     Formatting, always in the location's zone
  ------------------------------------------------------------------ */
  const fmt = (opts) => new Intl.DateTimeFormat('en-GB', { timeZone: TZ, ...opts });
  const fTime = fmt({ hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const fDow = fmt({ weekday: 'short' });
  const fDayNum = fmt({ day: 'numeric' });
  const fDayMonth = fmt({ day: 'numeric', month: 'short' });
  const fFull = fmt({ weekday: 'short', day: 'numeric', month: 'short' });
  const fLong = fmt({ weekday: 'long', day: 'numeric', month: 'long' });
  const fYmd = fmt({ year: 'numeric', month: '2-digit', day: '2-digit' });
  const fZone = fmt({ timeZoneName: 'short' });
  const ymd = (date) => { const p = Object.fromEntries(fYmd.formatToParts(date).map(x => [x.type, x.value])); return `${p.year}-${p.month}-${p.day}`; };
  const zoneName = () => fZone.formatToParts(SERVER_NOW).find(p => p.type === 'timeZoneName').value;
  const when = (iso) => { const t = new Date(iso); return ymd(t) === ymd(SERVER_NOW) ? `today ${fTime.format(t)}` : `${fFull.format(t)}, ${fTime.format(t)}`; };
  const ord = (n) => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const icon = {
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
    left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>',
    right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>',
    cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  };

  /* ------------------------------------------------------------------
     State
  ------------------------------------------------------------------ */
  const params = new URLSearchParams(location.search);
  const state = params.get('state') || 'default';
  let model = state === 'loading' ? null : scenario(state);
  let selected = model ? model.focus : '2026-10-13';
  const app = document.getElementById('app');

  const weekDays = () => Array.from({ length: 7 }, (_, i) => {
    const date = new Date(new Date(`${WEEK_START}T12:00:00Z`).getTime() + i * 86400e3);
    return { key: ymd(date), date };
  });

  function entitlementOk(s) {
    const e = model.entitlement;
    if (!e) return false;
    if (e.status === 'active') return true;
    if (e.status === 'past_due') return new Date(s.starts_at) < new Date(e.grace_until) && SERVER_NOW < new Date(e.grace_until);
    return false;
  }

  /* One card. Everything shown is a stored column or computed from them. */
  function card(s) {
    const st = new Date(s.starts_at), en = new Date(s.ends_at);
    const mins = Math.round((en - st) / 60000);
    const dur = mins % 60 === 0 ? `${mins / 60} h` : mins > 60 ? `${Math.floor(mins / 60)} h ${mins % 60} min` : `${mins} min`;
    const placesLeft = s.capacity - s.booked_count;
    const started = SERVER_NOW >= st, ended = SERVER_NOW >= en;
    const mb = s.my_booking;
    const label = `${s.class_type.name}, ${fFull.format(st)} ${fTime.format(st)}`;
    let cls = 'card', status = '', action = '', meter = '';

    if (s.status === 'cancelled') {
      cls += ' c-cancelled is-done';
      status = `<span class="badge b-muted">Cancelled</span><span class="c-note">By the gym${s.cancel_reason ? `: ${esc(s.cancel_reason).toLowerCase()}` : ''}</span>`;
    } else if (mb && mb.status === 'attended') {
      cls += ' is-done';
      status = `<span class="badge b-ok">${icon.check}Attended</span>`;
    } else if (mb && mb.status === 'no_show') {
      cls += ' is-done';
      status = `<span class="badge b-danger">Missed</span>`;
    } else if (ended) {
      cls += ' is-done';
      status = `<span class="c-note">Ended</span>`;
    } else if (started) {
      status = mb && mb.status === 'booked' ? `<span class="badge b-ok">${icon.check}Booked</span><span class="c-note">In progress</span>` : `<span class="c-note">In progress</span>`;
    } else if (mb && mb.status === 'booked') {
      cls += ' mine-booked';
      const free = SERVER_NOW <= new Date(mb.free_cancel_until);
      status = `<span class="badge b-ok">${icon.check}Booked</span>` + (free
        ? `<span class="c-note">Free cancellation until ${when(mb.free_cancel_until)}</span>`
        : `<span class="c-note warn">Free cancellation ended ${when(mb.free_cancel_until)}. Cancelling now counts as a no-show.</span>`);
      action = `<button class="btn btn-secondary" data-act="cancel" data-id="${s.session_id}" aria-label="Cancel booking: ${esc(label)}">Cancel</button>`;
    } else if (mb && mb.status === 'waitlisted') {
      cls += ' mine-wait';
      status = `<span class="badge b-wait">${icon.clock}Waitlist: ${ord(mb.waitlist_position)}</span>
        <span class="c-note">${ord(mb.waitlist_position)} of ${s.waitlist_count}. If a place opens you're booked automatically and notified.</span>`;
      action = `<button class="btn btn-secondary" data-act="leave" data-id="${s.session_id}" aria-label="Leave waitlist: ${esc(label)}">Leave waitlist</button>`;
    } else if (!entitlementOk(s)) {
      const e = model.entitlement;
      status = placesLeft > 0
        ? `<span class="places">${placesLeft} of ${s.capacity} places left</span>`
        : `<span class="places full">Full</span>`;
      status += e && e.status === 'past_due'
        ? `<span class="c-note warn">After your pass pauses</span>`
        : `<span class="c-note">You need a pass or class pack to book</span>`;
      action = `<button class="btn" disabled aria-label="Booking unavailable: ${esc(label)}">Book</button>`;
    } else if (placesLeft > 0) {
      status = `<span class="places${placesLeft <= 2 ? ' low' : ''}">${placesLeft === 1 ? 'Last place' : `${placesLeft} of ${s.capacity} places left`}</span>`;
      action = `<button class="btn btn-primary" data-act="book" data-id="${s.session_id}" aria-label="Book ${esc(label)}">Book</button>`;
    } else {
      status = `<span class="places full">Full</span><span class="c-note">${s.waitlist_count === 0 ? 'Waitlist is open, nobody waiting yet' : `${s.waitlist_count} on the waitlist`}</span>`;
      action = `<button class="btn btn-secondary" data-act="book" data-id="${s.session_id}" aria-label="Join waitlist: ${esc(label)}">Join waitlist</button>`;
    }

    if (s.status === 'scheduled' && !ended) {
      const pct = Math.round((s.booked_count / s.capacity) * 100);
      meter = `<div class="meter" role="img" aria-label="${s.booked_count} of ${s.capacity} places taken"><i style="width:${pct}%"></i></div>`;
    }

    return `<article class="${cls}" aria-label="${esc(label)}">
      <div class="c-row"><span class="c-time">${fTime.format(st)}–${fTime.format(en)}</span><span class="c-dur">${dur}</span></div>
      <h3 class="c-title">${esc(s.class_type.name)}</h3>
      <div class="c-meta">${esc(s.class_type.level)} · with ${esc(s.instructor_name)}</div>
      ${meter}
      <div class="c-foot"><div class="c-status">${status}</div>${action}</div>
    </article>`;
  }

  function header() {
    const e = model && model.entitlement;
    let pass = '';
    if (e && e.status === 'active') pass = `<div class="pass"><b>${esc(e.plan_name)}</b><span>Renews ${fDayMonth.format(new Date(e.current_period_end))}</span></div>`;
    else if (e && e.status === 'past_due') pass = `<div class="pass bad"><b>Payment failed</b><span>${esc(e.plan_name)}</span></div>`;
    const days = weekDays();
    const first = days[0].date, last = days[6].date;
    return `<header class="top">
        <div class="gym"><span class="gym-name">Granite Works</span>
          <button class="loc-btn" aria-haspopup="listbox" aria-label="Location: Kirkstall. Change location">Kirkstall ${icon.chev}</button></div>
        ${pass}
      </header>
      <div class="week-bar">
        <div><div class="week-title">${fDayNum.format(first)}–${fDayMonth.format(last)} 2026</div>
          <div class="week-sub">Times in Leeds time (${zoneName()})</div></div>
        <div class="nav-btns"><button class="icon-btn" aria-label="Previous week">${icon.left}</button><button class="icon-btn" aria-label="Next week">${icon.right}</button></div>
      </div>`;
  }

  function banner() {
    const e = model.entitlement;
    if (!e || e.status !== 'past_due') return '';
    const g = new Date(e.grace_until);
    return `<div class="banner" role="alert">${icon.alert}
      <div class="banner-body"><div><div class="banner-title">Your last payment didn't go through</div>
        <p>Your Monthly Unlimited pass keeps working until ${fLong.format(g)}, ${fTime.format(g)}. Update your card to keep booking after that.</p></div>
        <button class="btn btn-danger">Update card</button></div></div>`;
  }

  function dayStrip(byDay) {
    const today = ymd(SERVER_NOW);
    return `<div class="days" role="group" aria-label="Day">${weekDays().map(({ key, date }) => {
      const list = byDay[key] || [];
      const marks = list.map(s => s.my_booking && s.my_booking.status === 'booked' ? '<i class="m-booked"></i>' : s.my_booking && s.my_booking.status === 'waitlisted' ? '<i class="m-wait"></i>' : '').join('');
      const isPast = key < today;
      return `<button class="day-tab${key === today ? ' is-today' : ''}${isPast ? ' is-past' : ''}" data-day="${key}" aria-pressed="${key === selected}"
        aria-label="${fLong.format(date)}, ${list.length} ${list.length === 1 ? 'class' : 'classes'}">
        <span class="dow">${fDow.format(date)}</span><span class="dnum">${fDayNum.format(date)}</span><span class="marks">${marks}</span></button>`;
    }).join('')}</div>`;
  }

  function render() {
    if (!model) return renderLoading();
    const byDay = {};
    model.data.forEach(s => (byDay[ymd(new Date(s.starts_at))] ||= []).push(s));
    let body;
    if (model.data.length === 0) {
      const n = new Date(model.next_scheduled_at);
      body = `<section class="empty">${icon.cal}
        <h2>No classes at Kirkstall this week</h2>
        <p>The next class here is on ${fLong.format(n)} at ${fTime.format(n)}.</p>
        <div class="actions"><button class="btn btn-primary">Go to next week</button><button class="btn btn-secondary">Try another location</button></div>
      </section>`;
    } else {
      const today = ymd(SERVER_NOW);
      body = dayStrip(byDay) + `<div class="week">${weekDays().map(({ key, date }) => {
        const list = byDay[key] || [];
        return `<section class="day${key === selected ? ' is-selected' : ''}${key === today ? ' is-today' : ''}${key < today ? ' is-past' : ''}" aria-label="${fLong.format(date)}">
          <div class="day-head"><span class="dow">${fDow.format(date)}</span><span class="dnum">${fDayNum.format(date)}</span>${key === today ? '<span class="today-tag">Today</span>' : ''}</div>
          <h2 class="mobile-day-title">${key === today ? 'Today, ' : ''}${fLong.format(date)}</h2>
          ${list.length ? list.map(card).join('') : '<p class="day-empty">No classes</p>'}
        </section>`;
      }).join('')}</div>`;
    }
    app.removeAttribute('aria-busy');
    app.innerHTML = header() + banner() + body;
  }

  function renderLoading() {
    app.setAttribute('aria-busy', 'true');
    app.innerHTML = `<header class="top"><div class="gym"><span class="gym-name">Granite Works</span>
        <button class="loc-btn" aria-label="Location: Kirkstall">Kirkstall ${icon.chev}</button></div>
        <div class="sk" style="width:120px;height:32px"></div></header>
      <div class="week-bar"><div><div class="sk" style="width:130px;height:18px;margin-bottom:6px"></div><div class="sk" style="width:160px;height:14px"></div></div></div>
      <span class="sr">Loading this week's classes</span>
      <div class="days" aria-hidden="true">${Array.from({ length: 7 }, () => '<div class="sk" style="height:56px;border-radius:10px"></div>').join('')}</div>
      <div class="week" aria-hidden="true">${Array.from({ length: 7 }, (_, i) =>
        `<div class="day${i === 1 ? ' is-selected' : ''}"><div class="day-head"><div class="sk" style="width:60px;height:20px"></div></div>
          ${Array.from({ length: i % 3 === 0 ? 2 : 3 }, () => '<div class="sk sk-card"></div>').join('')}</div>`).join('')}</div>`;
  }

  /* ------------------------------------------------------------------
     Interactions (local only in this prototype; real app calls the API
     with an Idempotency-Key and re-renders from the response)
  ------------------------------------------------------------------ */
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
  }

  const dlg = document.getElementById('confirm');
  function confirmCancel(s) {
    const mb = s.my_booking;
    const free = SERVER_NOW <= new Date(mb.free_cancel_until);
    const st = new Date(s.starts_at);
    dlg.innerHTML = `<h2 id="confirm-title">Cancel ${esc(s.class_type.name)}?</h2>
      <p>${fFull.format(st)}, ${fTime.format(st)} with ${esc(s.instructor_name)}</p>
      <div class="consequence ${free ? 'free' : 'late'}">${free
        ? `You're inside the free cancellation window, which ends ${when(mb.free_cancel_until)}. Your place goes to the first person on the waitlist.`
        : `Free cancellation ended ${when(mb.free_cancel_until)}. If you cancel now it counts as a no-show. Your place still goes to the first person on the waitlist.`}</div>
      <div class="row"><button class="btn btn-secondary" value="keep">Keep my place</button><button class="btn ${free ? 'btn-primary' : 'btn-danger'}" value="cancel">${free ? 'Cancel booking' : 'Cancel anyway'}</button></div>`;
    dlg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      dlg.close();
      if (b.value === 'cancel') {
        s.my_booking = null; s.booked_count -= 1;
        if (s.waitlist_count > 0) { s.waitlist_count -= 1; s.booked_count += 1; }
        render(); toast(free ? 'Booking cancelled' : 'Booking cancelled. Recorded as a no-show.');
      }
    }));
    dlg.showModal();
  }

  app.addEventListener('click', (ev) => {
    const day = ev.target.closest('[data-day]');
    if (day) { selected = day.dataset.day; render(); return; }
    const b = ev.target.closest('[data-act]');
    if (!b) return;
    const s = model.data.find(x => x.session_id === b.dataset.id);
    if (b.dataset.act === 'book') {
      if (s.booked_count < s.capacity) {
        s.booked_count += 1;
        s.my_booking = { id: 'new', status: 'booked', waitlist_position: null,
          free_cancel_until: new Date(new Date(s.starts_at).getTime() - 12 * 3600e3).toISOString() };
        render(); toast(`Booked: ${s.class_type.name}, ${fFull.format(new Date(s.starts_at))}`);
      } else {
        s.waitlist_count += 1;
        s.my_booking = { id: 'new', status: 'waitlisted', waitlist_position: s.waitlist_count, free_cancel_until: null };
        render(); toast(`You're ${ord(s.waitlist_count)} on the waitlist`);
      }
    } else if (b.dataset.act === 'cancel') {
      confirmCancel(s);
    } else if (b.dataset.act === 'leave') {
      s.my_booking = null; s.waitlist_count -= 1; render(); toast('You left the waitlist');
    }
  });

  render();
})();
</script>
</body>
</html>

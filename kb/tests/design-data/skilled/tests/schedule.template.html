<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<title>Schedule · Crux</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23036852'/%3E%3Cg fill='%23fff'%3E%3Ccircle cx='9' cy='16' r='3'/%3E%3Ccircle cx='16' cy='16' r='3'/%3E%3Ccircle cx='23' cy='16' r='3' fill-opacity='.45'/%3E%3C/g%3E%3C/svg%3E">
<!--
Build note (design-director section 4, design-data reference 07).
Data: every number, label and state is rendered from a response of api.location_schedule (schema.sql) captured by
tests/make_fixtures.sh on a seeded database; the page never invents a value. The data-to-screen contract is in
handover.md. States by URL: ?state=loading | empty | error | places-left | full | waitlist | booked | late-cancel |
late-cancel-confirm | past-due | lapsed (default: the week as returned).
Truth contract: the week summary is the server's summary (data-num); empty and loading carry data-data="none".
Type: Inter, named first in a system stack; production self-hosts Inter as hashed WOFF2 with preload (not inlined).
-->
<style>
@layer reset, tokens, base, components, states;

@layer reset {
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body, h1, h2, h3, p, ul, ol, li, dl, dd, figure { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  button, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
}

@layer tokens {
  :root {
    color-scheme: light dark;
    /* Primitives: oklch_scale.py, neutral hue 250 chroma .014; teal hue 172 chroma .12; amber 70; red 25. */
    --color-neutral-0: #ffffff;
    --color-neutral-50: #f6f7f8; --color-neutral-100: #e7eaec; --color-neutral-200: #d4d8dc;
    --color-neutral-300: #bcc2c8; --color-neutral-500: #848b93; --color-neutral-600: #666d74; --color-neutral-650: #5d646b;
    --color-neutral-700: #53595f; --color-neutral-800: #41464b; --color-neutral-900: #2f3337;
    --color-neutral-950: #1f2225; --color-neutral-975: #171a1c; --color-neutral-990: #101214;
    --color-teal-50: #eefaf6; --color-teal-100: #d4f1e7; --color-teal-200: #b0e5d3; --color-teal-300: #81d4ba;
    --color-teal-600: #037e65; --color-teal-700: #036852; --color-teal-800: #025240; --color-teal-900: #003d2f;
    --color-amber-50: #fdf6eb; --color-amber-200: #f3d1a4; --color-amber-300: #eab672; --color-amber-700: #7d4b00; --color-amber-800: #643a00;
    --color-red-50: #fff4f3; --color-red-200: #ffc8c3; --color-red-300: #ffa69e; --color-red-700: #a01d23; --color-red-800: #811218;

    /* Roles, light */
    --color-bg: var(--color-neutral-50);
    --color-surface: var(--color-neutral-0);
    --color-surface-raised: var(--color-neutral-0);
    --color-surface-sunken: var(--color-neutral-100);
    --color-text: var(--color-neutral-900);
    --color-text-muted: var(--color-neutral-650); /* 650, not 600: stays over 4.5:1 under the pressed layer on --color-bg */
    --color-text-muted-on-tint: var(--color-neutral-700);
    --color-border: var(--color-neutral-200);
    --color-border-strong: var(--color-neutral-500);
    --color-primary: var(--color-teal-600);
    --color-primary-hover: var(--color-teal-700);
    --color-primary-active: var(--color-teal-800);
    --color-on-primary: var(--color-neutral-0);
    --color-accent: var(--color-teal-700);
    --color-primary-subtle: var(--color-teal-50);
    --color-on-primary-subtle: var(--color-teal-800);
    --color-primary-subtle-border: var(--color-teal-200);
    --color-warning: var(--color-amber-700);
    --color-warning-subtle: var(--color-amber-50);
    --color-on-warning-subtle: var(--color-amber-800);
    --color-warning-subtle-border: var(--color-amber-200);
    --color-danger: var(--color-red-700);
    --color-danger-subtle: var(--color-red-50);
    --color-on-danger-subtle: var(--color-red-800);
    --color-danger-subtle-border: var(--color-red-200);
    --color-place-taken: var(--color-neutral-700);
    --color-place-free: var(--color-neutral-500);
    --color-focus-ring: var(--color-teal-600);
    --color-selected-bg: var(--color-teal-100);
    --color-selected-text: var(--color-teal-900);
    --color-skeleton: var(--color-neutral-100);

    --space-0: 0; --space-1: 2px; --space-2: 4px; --space-3: 8px; --space-4: 12px; --space-5: 16px;
    --space-6: 24px; --space-7: 32px; --space-8: 48px; --space-9: 64px; --space-10: 96px;
    --space-gap-sm: var(--space-3); --space-gap-md: var(--space-5); --space-gap-lg: var(--space-6);

    --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --text-xs: 0.75rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.25rem; --text-xl: 1.5625rem; --text-2xl: 1.9375rem;
    --leading-tight: 1.1; --leading-snug: 1.25; --leading-normal: 1.5;
    --weight-regular: 400; --weight-medium: 500; --weight-semibold: 600; --weight-bold: 700;
    --size-measure: 52ch;

    --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-full: 9999px;
    --radius-control: var(--radius-md); --radius-card: var(--radius-lg);
    --size-control-sm: 32px; --size-control-md: 40px; --size-control-lg: 48px; --size-touch: 44px;
    --size-icon-sm: 12px; --size-icon-md: 16px; --size-icon-lg: 20px; --size-icon-xl: 24px; --icon-stroke: 1.5px;
    --size-place: 8px;

    --duration-instant: 100ms; --duration-fast: 150ms; --duration-base: 200ms;
    --ease-standard: cubic-bezier(0.2, 0, 0, 1); --ease-enter: cubic-bezier(0, 0, 0, 1); --ease-exit: cubic-bezier(0.3, 0, 1, 1);
    --motion-hover: var(--duration-instant) var(--ease-standard);
    --motion-enter: var(--duration-base) var(--ease-enter);
    --motion-exit: var(--duration-fast) var(--ease-exit);
    --loader-delay: 150ms;

    --shadow-rgb: 31 34 37;
    --ring: 0 0 0 1px rgb(var(--shadow-rgb) / 0.08);
    --highlight: inset 0 1px 0 rgb(255 255 255 / 0.12);
    --shadow-1: 0 1px 2px rgb(var(--shadow-rgb) / 0.06);
    --shadow-4: 0 4px 8px -2px rgb(var(--shadow-rgb) / 0.10), 0 24px 48px -12px rgb(var(--shadow-rgb) / 0.24);
    --elevation-card: var(--ring), var(--shadow-1);
    --elevation-modal: var(--ring), var(--shadow-4);
    --state-hover: color-mix(in oklch, var(--color-text) 8%, transparent);
    --state-pressed: color-mix(in oklch, var(--color-text) 10%, transparent);
    --appbar-height: 56px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: var(--color-neutral-990);
      --color-surface: var(--color-neutral-975);
      --color-surface-raised: var(--color-neutral-950);
      --color-surface-sunken: var(--color-neutral-990);
      --color-text: var(--color-neutral-50);
      --color-text-muted: var(--color-neutral-300);
      --color-text-muted-on-tint: var(--color-neutral-200);
      --color-border: var(--color-neutral-800);
      --color-border-strong: var(--color-neutral-500);
      --color-primary: var(--color-teal-600);
      --color-primary-hover: var(--color-teal-700);
      --color-primary-active: var(--color-teal-800);
      --color-accent: var(--color-teal-300);
      --color-primary-subtle: oklch(27% 0.035 172);
      --color-on-primary-subtle: var(--color-teal-200);
      --color-primary-subtle-border: oklch(38% 0.05 172);
      --color-warning: var(--color-amber-300);
      --color-warning-subtle: oklch(27% 0.035 70);
      --color-on-warning-subtle: var(--color-amber-200);
      --color-warning-subtle-border: oklch(40% 0.06 70);
      --color-danger: var(--color-red-300);
      --color-danger-subtle: oklch(27% 0.04 25);
      --color-on-danger-subtle: var(--color-red-200);
      --color-danger-subtle-border: oklch(40% 0.08 25);
      --color-place-taken: var(--color-neutral-300);
      --color-place-free: var(--color-neutral-500);
      --color-focus-ring: var(--color-teal-300);
      --color-selected-bg: var(--color-teal-800);
      --color-selected-text: var(--color-neutral-50);
      --color-skeleton: var(--color-neutral-950);
      --ring: 0 0 0 1px rgb(255 255 255 / 0.08);
      --highlight: inset 0 1px 0 rgb(255 255 255 / 0.06);
      --shadow-1: 0 0 0 0 transparent;
      --shadow-4: 0 0 0 0 transparent;
      --elevation-card: var(--ring);
      --elevation-modal: var(--ring), var(--highlight);
    }
  }
}

@layer base {
  html { scroll-padding-top: calc(var(--appbar-height) + var(--space-5)); }
  body {
    font-family: var(--font-sans); font-size: var(--text-base); line-height: var(--leading-normal);
    color: var(--color-text); background: var(--color-bg);
    font-feature-settings: "cv11" 1, "ss01" 0;
    -webkit-font-smoothing: antialiased; font-synthesis: none;
    padding-bottom: env(safe-area-inset-bottom);
  }
  h1, h2, h3 { line-height: var(--leading-snug); text-wrap: balance; }
  p { text-wrap: pretty; }
  time, [data-num], .num { font-variant-numeric: tabular-nums lining-nums; }
  :focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 2px; }
  ::selection { background: var(--color-selected-bg); color: var(--color-selected-text); }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  .nowrap { white-space: nowrap; }
  svg.icon { width: var(--size-icon-md); height: var(--size-icon-md); flex: none; fill: none; stroke: currentColor;
    stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  a { color: var(--color-accent); text-underline-offset: 0.15em; }
}

@layer components {
  /* Skip link */
  .skip { position: fixed; left: var(--space-5); top: calc(var(--appbar-height) + var(--space-3)); z-index: 20; min-height: var(--size-touch); display: inline-flex; align-items: center; padding: var(--space-3) var(--space-4);
    background: var(--color-surface-raised); color: var(--color-text); border-radius: var(--radius-control); box-shadow: var(--elevation-modal);
  }
  .skip:not(:focus-visible) { clip-path: inset(50%); }

  /* App bar */
  .appbar { position: sticky; top: 0; z-index: 10; height: var(--appbar-height);
    display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-5);
    padding-left: max(var(--space-5), env(safe-area-inset-left)); padding-right: max(var(--space-5), env(safe-area-inset-right));
    background: color-mix(in oklch, var(--color-bg) 92%, transparent); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--color-border); }
  .brand { display: inline-flex; align-items: center; color: var(--color-text); min-height: var(--size-touch); }
  .brand svg { height: 20px; width: auto; fill: currentColor; }
  .place { margin-left: auto; position: relative; display: flex; align-items: center; }
  .place select { appearance: none; min-height: var(--size-touch); max-width: 60vw;
    padding: var(--space-3) var(--space-7) var(--space-3) var(--space-4);
    font-size: var(--text-sm); font-weight: var(--weight-medium); line-height: var(--leading-snug);
    background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: var(--radius-control);
    text-overflow: ellipsis; cursor: pointer; }
  .place .icon { position: absolute; right: var(--space-4); pointer-events: none; color: var(--color-text-muted); }
  .avatar { flex: none; display: inline-grid; place-items: center; width: var(--size-control-sm); height: var(--size-control-sm);
    border-radius: var(--radius-full); background: var(--color-surface); box-shadow: var(--ring); color: var(--color-text);
    font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: 0.02em; }

  /* Layout */
  .page { max-width: 1120px; margin: 0 auto; padding: var(--space-5) var(--space-5) var(--space-8);
    padding-left: max(var(--space-5), env(safe-area-inset-left)); padding-right: max(var(--space-5), env(safe-area-inset-right));
    display: grid; gap: var(--space-4); grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "week" "mine" "list" "pass"; }
  .page-head { grid-area: head; display: grid; gap: var(--space-1); }
  .page-head h1 { font-size: var(--text-xl); font-weight: var(--weight-bold); letter-spacing: -0.015em; line-height: var(--leading-tight); }
  .page-head p { font-size: var(--text-sm); color: var(--color-text-muted); }
  #week { grid-area: week; } #mine { grid-area: mine; } #pass { grid-area: pass; }
  #week:empty, #mine:empty, #pass:empty { display: none; }
  .list { grid-area: list; display: grid; gap: var(--space-5); align-content: start; min-width: 0; margin-top: var(--space-2); }
  @media (min-width: 64rem) {
    .page { grid-template-columns: 300px minmax(0, 1fr); grid-template-rows: auto auto auto auto 1fr;
      grid-template-areas: "head head" "week list" "mine list" "pass list" ". list"; column-gap: var(--space-7); row-gap: var(--space-4);
      padding-top: var(--space-7); }
    .page-head h1 { font-size: var(--text-2xl); }
    .list { margin-top: 0; }
  }

  /* Week switcher */
  .week { display: flex; align-items: center; gap: var(--space-2); }
  .week h2 { flex: 1; font-size: var(--text-base); font-weight: var(--weight-semibold); text-align: center; }
  .icon-btn { display: inline-grid; place-items: center; padding: 0; width: var(--size-touch); height: var(--size-touch); flex: none;
    border-radius: var(--radius-control); border: 1px solid var(--color-border-strong); background: var(--color-surface);
    color: var(--color-text); cursor: pointer; }
  .icon-btn .icon { width: var(--size-icon-lg); height: var(--size-icon-lg); }
  .tz { font-size: var(--text-xs); color: var(--color-text-muted); text-align: center; }
  .week-card { display: grid; gap: var(--space-1); }
  @media (min-width: 64rem) { .week-card { background: var(--color-surface); border-radius: var(--radius-card); box-shadow: var(--elevation-card); padding: var(--space-4); } }

  /* Cards in the side column */
  .card { background: var(--color-surface); border-radius: var(--radius-card); box-shadow: var(--elevation-card); padding: var(--space-5); }
  .card h2 { font-size: var(--text-sm); font-weight: var(--weight-semibold); color: var(--color-text-muted); }
  .tallies { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-top: var(--space-3); }
  .tally { display: grid; gap: var(--space-1); }
  .tally .n { font-size: var(--text-xl); font-weight: var(--weight-semibold); line-height: var(--leading-tight); letter-spacing: -0.01em; }
  .tally .l { font-size: var(--text-sm); color: var(--color-text-muted); }
  .next { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--color-border); font-size: var(--text-sm); }
  .next a { color: var(--color-text); font-weight: var(--weight-semibold); text-decoration: underline; text-decoration-color: var(--color-border-strong); }
  .next span { color: var(--color-text-muted); }
  .pass p { font-size: var(--text-sm); color: var(--color-text-muted); }
  .pass .pass-name { margin-top: var(--space-2); font-size: var(--text-base); font-weight: var(--weight-semibold); color: var(--color-text); }
  .pass .pass-flag { display: flex; gap: var(--space-2); align-items: flex-start; margin-top: var(--space-3); color: var(--color-text); }
  .pass .pass-flag .icon { margin-top: var(--space-1); color: var(--color-warning); }
  .pass .pass-flag.danger .icon { color: var(--color-danger); }

  /* Banner */
  .banner { display: grid; grid-template-columns: auto 1fr; gap: var(--space-3) var(--space-4); align-items: start;
    padding: var(--space-5); border-radius: var(--radius-card); border: 1px solid var(--color-warning-subtle-border);
    background: var(--color-warning-subtle); color: var(--color-on-warning-subtle); }
  .banner .icon { margin-top: var(--space-1); }
  .banner h2 { font-size: var(--text-base); font-weight: var(--weight-semibold); }
  .banner p { font-size: var(--text-sm); max-inline-size: var(--size-measure); margin-top: var(--space-1); }
  .banner .actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .banner.danger { border-color: var(--color-danger-subtle-border); background: var(--color-danger-subtle); color: var(--color-on-danger-subtle); }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-3); min-height: var(--size-touch);
    padding: var(--space-3) var(--space-5); border-radius: var(--radius-control); border: 1px solid transparent;
    font-size: var(--text-base); font-weight: var(--weight-semibold); line-height: var(--leading-snug); text-decoration: none;
    cursor: pointer; position: relative; white-space: nowrap;
    transition: background-color var(--motion-hover), border-color var(--motion-hover), color var(--motion-hover); }
  .btn-primary { background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--highlight); }
  .btn-secondary { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border-strong); }
  .btn-danger { background: var(--color-surface); color: var(--color-danger); border-color: var(--color-danger); }
  .btn[disabled], .btn[aria-disabled="true"] { cursor: not-allowed; background: var(--color-surface-sunken); color: var(--color-text-muted-on-tint); border-color: transparent; box-shadow: none; }
  .btn .spinner { position: absolute; inset: 0; margin: auto; width: var(--size-icon-md); height: var(--size-icon-md); opacity: 0;
    border: 2px solid currentColor; border-right-color: transparent; border-radius: var(--radius-full); }
  .btn[aria-busy="true"] .label { opacity: 0; }
  .btn[aria-busy="true"] .spinner { opacity: 1; transition: opacity var(--duration-fast) var(--ease-standard) var(--loader-delay);
    animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }

  /* Day strip */
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--space-2); }
  .day-link { display: grid; justify-items: center; gap: var(--space-1); min-height: var(--size-control-lg); padding: var(--space-2) 0 var(--space-3);
    border-radius: var(--radius-control); color: var(--color-text); text-decoration: none; font-size: var(--text-xs); line-height: var(--leading-snug); }
  .day-link .dn { color: var(--color-text-muted); }
  .day-link .dd { font-size: var(--text-base); font-weight: var(--weight-semibold); }
  .day-link .mark { width: 6px; height: 6px; border-radius: var(--radius-full); background: transparent; }
  .day-link[data-mine="true"] .mark { background: var(--color-primary); }
  .day-link[aria-current="date"] { background: var(--color-surface); box-shadow: var(--elevation-card); }
  .day-link[aria-current="date"] .dn { color: var(--color-accent); font-weight: var(--weight-semibold); }
  .asof { font-size: var(--text-xs); color: var(--color-text-muted); }

  /* Day group */
  .day { display: grid; gap: var(--space-3); }
  .day-head { display: flex; align-items: baseline; gap: var(--space-3); padding: 0 var(--space-1); }
  .day-head h3 { font-size: var(--text-sm); font-weight: var(--weight-semibold); }
  .today-tag { font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--color-accent); }
  .day-empty { font-size: var(--text-sm); color: var(--color-text-muted); padding: 0 var(--space-1); }
  .classes { background: var(--color-surface); border-radius: var(--radius-card); box-shadow: var(--elevation-card); overflow: clip; }
  .cls + .cls { border-top: 1px solid var(--color-border); }

  /* Class row */
  .cls-row { width: 100%; display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: var(--space-1) var(--space-4);
    align-items: start; padding: var(--space-4) var(--space-5); background: transparent; border: 0; text-align: left; cursor: pointer;
    transition: background-color var(--motion-hover); }
  .cls-row .t { display: grid; gap: var(--space-1); padding-top: var(--space-1); }
  .cls-row .t time { font-size: var(--text-base); font-weight: var(--weight-semibold); line-height: var(--leading-snug); }
  .cls-row .t .t-end { font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-snug); white-space: nowrap; }
  .cls-row .body { display: grid; gap: var(--space-2); min-width: 0; padding-top: var(--space-1); }
  .cls-row .name { font-size: var(--text-base); font-weight: var(--weight-semibold); line-height: var(--leading-snug); }
  .cls-row .meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-snug); }
  .cls-row .status { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
  .cls-row .warn { display: inline-flex; gap: var(--space-2); align-items: center; font-size: var(--text-sm); line-height: var(--leading-snug); color: var(--color-warning); }
  .cls-row .chev { margin-top: var(--space-2); color: var(--color-text-muted); transition: transform var(--motion-hover); }
  .cls-row[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .cls[data-muted="true"] .name, .cls[data-muted="true"] .t time { color: var(--color-text-muted); }

  /* Places rail: one dot per place, filled when taken (the product's signature, design brief section 7) */
  .rail { display: inline-flex; gap: var(--space-1); align-items: center; flex: none; }
  .rail i { width: var(--size-place); height: var(--size-place); border-radius: var(--radius-full); border: 1.5px solid var(--color-place-free); }
  .rail i.on { background: var(--color-place-taken); border-color: var(--color-place-taken); }
  .rail.lg i { width: 12px; height: 12px; }
  .bar { position: relative; display: inline-block; width: 96px; height: 8px; border-radius: var(--radius-full); background: var(--color-surface-sunken); box-shadow: inset 0 0 0 1px var(--color-place-free); }
  .bar > i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--color-place-taken); }

  /* Status chips */
  .chip { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-3);
    border-radius: var(--radius-full); font-size: var(--text-sm); font-weight: var(--weight-semibold); line-height: var(--leading-snug); white-space: nowrap; }
  .chip .icon { width: var(--size-icon-sm); height: var(--size-icon-sm); stroke-width: 2px; } /* heavier stroke beside 14px semibold labels */
  .chip-booked { background: var(--color-primary-subtle); color: var(--color-on-primary-subtle); box-shadow: inset 0 0 0 1px var(--color-primary-subtle-border); }
  .chip-queue { background: var(--color-surface-sunken); color: var(--color-text); box-shadow: inset 0 0 0 1px var(--color-border-strong); }
  .chip-quiet { background: var(--color-surface-sunken); color: var(--color-text-muted-on-tint); }
  .chip-cancel { background: var(--color-danger-subtle); color: var(--color-on-danger-subtle); }

  /* Class detail */
  .detail { padding: 0 var(--space-5) var(--space-5); display: grid; gap: var(--space-4); }
  .detail-inner { display: grid; gap: var(--space-4); padding: var(--space-5); border-radius: var(--radius-md); background: var(--color-surface-sunken); }
  @media (min-width: 40rem) { .detail { grid-template-columns: 72px minmax(0, 1fr); column-gap: var(--space-4); } .detail-inner { grid-column: 2; } }
  .status-line { font-size: var(--text-lg); font-weight: var(--weight-semibold); line-height: var(--leading-snug); letter-spacing: -0.01em; }
  .facts { display: grid; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-text-muted-on-tint); }
  .facts div { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
  .facts strong { color: var(--color-text); font-weight: var(--weight-semibold); }
  .policy { display: flex; gap: var(--space-3); align-items: flex-start; font-size: var(--text-sm); color: var(--color-text); max-inline-size: var(--size-measure); }
  .policy .icon { margin-top: var(--space-1); color: var(--color-text-muted-on-tint); }
  .policy.warn .icon { color: var(--color-warning); }
  .policy.danger .icon { color: var(--color-danger); }
  .detail .actions { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .reason { font-size: var(--text-sm); color: var(--color-text-muted-on-tint); }
  .field-error { display: flex; gap: var(--space-2); align-items: flex-start; font-size: var(--text-sm); color: var(--color-danger); }
  .field-error .icon { margin-top: var(--space-1); }
  .place select[aria-invalid="true"] { border-color: var(--color-danger); box-shadow: inset 0 0 0 1px var(--color-danger); }

  /* Empty, error, loading */
  .panel { display: grid; justify-items: start; gap: var(--space-4); padding: var(--space-7) var(--space-6); background: var(--color-surface);
    border-radius: var(--radius-card); box-shadow: var(--elevation-card); }
  .panel h2 { font-size: var(--text-lg); font-weight: var(--weight-semibold); }
  .panel p { color: var(--color-text-muted); max-inline-size: var(--size-measure); }
  .panel .rail { margin-bottom: var(--space-2); }
  .sk { display: block; border-radius: var(--radius-sm); background: var(--color-skeleton); }
  .sk-row { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: var(--space-4); padding: var(--space-4) var(--space-5); }
  .sk-row + .sk-row { border-top: 1px solid var(--color-border); }
  .sk-stack { display: grid; gap: var(--space-3); padding-top: var(--space-2); }

  /* Dialog */
  dialog { width: min(100% - var(--space-7), 440px); padding: var(--space-6); border: 0; border-radius: var(--radius-xl);
    background: var(--color-surface-raised); color: var(--color-text); box-shadow: var(--elevation-modal); }
  dialog::backdrop { background: rgb(var(--shadow-rgb) / 0.48); }
  dialog h2 { font-size: var(--text-lg); font-weight: var(--weight-semibold); }
  dialog p { margin-top: var(--space-3); font-size: var(--text-base); color: var(--color-text-muted); }
  dialog .actions { display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-6); }
  @media (max-width: 39.99rem) { dialog { margin: auto auto var(--space-5); } dialog .actions .btn { flex: 1 1 100%; } }
}

@layer states {
  @media (hover: hover) and (pointer: fine) {
    .cls-row:hover, .icon-btn:hover, .day-link:hover, .btn-secondary:hover, .btn-danger:hover, .place select:hover { background-color: var(--state-hover); }
    .btn-primary:hover { background: var(--color-primary-hover); }
  }
  .cls-row:active, .icon-btn:active, .day-link:active, .btn-secondary:active, .btn-danger:active { background-color: var(--state-pressed); }
  .btn-primary:active { background: var(--color-primary-active); }
  .btn[disabled]:hover, .btn[disabled]:active { background: var(--color-surface-sunken); }
  .cls-row:focus-visible { outline-offset: -2px; } /* radius stays as at rest (focus never changes shape); the card's clip rounds the end rows */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0ms !important; }
    .btn[aria-busy="true"] .spinner { animation: none; border-right-color: currentColor; opacity: 0.6; }
  }
  @media (prefers-contrast: more) {
    :root { --color-text-muted: var(--color-text); --color-border: var(--color-border-strong); }
  }
}
</style>

<script type="application/json" id="fixtures">/*FIXTURES*/</script>
<script>
(() => {
  'use strict';
  const FX = JSON.parse(document.getElementById('fixtures').textContent);
  const params = new URLSearchParams(location.search);
  const STATE = params.get('state') || 'ready';
  const LANG = document.documentElement.lang || 'en-US';
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const NB = ' ';

  // ---------- Icons (one set: 16px grid, 1.5 stroke, round caps and joins, currentColor) ----------
  const ICON = {
    check: '<path d="M3.5 8.5l3 3 6-7"/>',
    queue: '<path d="M3 4.5h10M3 8h10M3 11.5h6"/>',
    clock: '<circle cx="8" cy="8" r="5.75"/><path d="M8 4.75V8l2.25 1.5"/>',
    alert: '<path d="M8 2.5l6 10.5H2z"/><path d="M8 6.5v3"/><path d="M8 11.5v.01"/>',
    stop: '<circle cx="8" cy="8" r="5.75"/><path d="M4 12L12 4"/>',
    info: '<circle cx="8" cy="8" r="5.75"/><path d="M8 7.25v3.5"/><path d="M8 5.25v.01"/>',
    left: '<path d="M10 3.5L5.5 8l4.5 4.5"/>',
    right: '<path d="M6 3.5l4.5 4.5L6 12.5"/>',
    down: '<path d="M4 6l4 4 4-4"/>',
    retry: '<path d="M3 8a5 5 0 1 0 1.5-3.5"/><path d="M3 2.5v3h3"/>'
  };
  const icon = (n, cls = '') => `<svg class="icon ${cls}" viewBox="0 0 16 16" aria-hidden="true">${ICON[n]}</svg>`;

  // ---------- Formatting at the edge (FOUNDATIONS content mechanics, en-US) ----------
  // Wall-clock values ("2026-10-13T18:30:00") are formatted from their parts; they never pass through the device zone.
  const parts = (local) => { const [d, t] = local.split('T'); const [y, mo, da] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number); return { y, mo, da, h, mi }; };
  const clock = (h, mi, withMer = true) => { const mer = h < 12 ? 'am' : 'pm'; const h12 = ((h + 11) % 12) + 1; const s = mi ? `${h12}:${String(mi).padStart(2, '0')}` : `${h12}`; return withMer ? `${s}${NB}${mer}` : s; };
  const merOf = (h) => (h < 12 ? 'am' : 'pm');
  const dateOnly = (iso, opts) => new Intl.DateTimeFormat(LANG, { ...opts, timeZone: 'UTC' }).format(new Date(iso + 'T00:00:00Z'));
  const dayLabel = (iso) => dateOnly(iso, { weekday: 'short', month: 'short', day: 'numeric' }).replace(/ /g, NB);
  const rangeLocal = (a, b) => { const p = parts(a), q = parts(b);
    return merOf(p.h) === merOf(q.h) ? `${clock(p.h, p.mi, false)}${NB}to ${clock(q.h, q.mi)}` : `${clock(p.h, p.mi)} to ${clock(q.h, q.mi)}`; };
  // Instants (deadlines, as_of) are formatted in the location's zone.
  const inZone = (instant, tz) => { const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    const o = Object.fromEntries(f.formatToParts(new Date(instant)).map((x) => [x.type, x.value])); return { date: `${o.year}-${o.month}-${o.day}`, h: Number(o.hour), mi: Number(o.minute) }; };
  const whenInZone = (instant, tz, today) => { const z = inZone(instant, tz); const t = clock(z.h, z.mi);
    if (z.date === today) return `today at ${t}`; return `${dayLabel(z.date)}, ${t}`; };
  const zoneShort = (tz) => new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortGeneric' }).formatToParts(new Date()).find((x) => x.type === 'timeZoneName').value;
  const ordinal = (n) => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const plural = (n, one, many) => `${n}${NB}${n === 1 ? one : many}`;
  const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const weekRange = (s, e) => { const a = dateOnly(s, { month: 'short', day: 'numeric' }), b = dateOnly(e, { month: 'short', day: 'numeric' });
    return a.split(' ')[0] === b.split(' ')[0] ? `${a.replace(' ', NB)}${NB}to ${b.split(' ')[1]}` : `${a.replace(' ', NB)} to ${b.replace(' ', NB)}`; };

  // ---------- Data ----------
  const me = FX.me;
  const keyFor = (locId, week) => `${locId}|${week}`;
  const WEEKS = {};
  for (const [k, v] of Object.entries(FX.weeks)) WEEKS[k] = v;
  let data = null;
  let open = null;            // id of the class whose detail is open
  const FOCUS = { 'places-left': '-000000000003', full: '-000000000007', waitlist: '-000000000004', booked: '-000000000008', 'late-cancel': '-000000000002', 'late-cancel-confirm': '-000000000002' };

  function pick() {
    if (STATE === 'past-due') return structuredClone(FX.weeks['state:past-due']);
    if (STATE === 'lapsed') return structuredClone(FX.weeks['state:lapsed']);
    if (STATE === 'empty') return structuredClone(FX.weeks[keyFor('a1000000-0000-7000-8000-000000000002', '2026-10-12')]);
    return structuredClone(FX.weeks[keyFor('a1000000-0000-7000-8000-000000000001', '2026-10-12')]);
  }

  // ---------- Rendering ----------
  const placesText = (c) => {
    if (c.status === 'cancelled') return 'Cancelled by the gym';
    if (c.has_ended) return 'Ended';
    if (c.places_left > 0 && c.waiting_count === 0) return `${plural(c.places_left, 'place', 'places')} left`;
    return c.waiting_count ? `Full, ${c.waiting_count}${NB}waiting` : 'Full';
  };
  const rail = (c, big = false) => {
    if (c.capacity > 16) {
      const pct = Math.round((c.taken_count / c.capacity) * 100);
      return `<span class="bar" role="img" aria-label="${c.taken_count} of ${c.capacity} places taken"><i data-bar="${pct}" style="width:${pct}%"></i></span>`;
    }
    let dots = ''; for (let i = 0; i < c.capacity; i++) dots += `<i class="${i < c.taken_count ? 'on' : ''}"></i>`;
    return `<span class="rail${big ? ' lg' : ''}" role="img" aria-label="${c.taken_count} of ${c.capacity} places taken">${dots}</span>`;
  };
  const chip = (c) => {
    const b = c.my_booking;
    if (c.status === 'cancelled') return `<span class="chip chip-cancel">${icon('stop')}Cancelled</span>`;
    if (!b) return '';
    if (b.status === 'confirmed') return `<span class="chip chip-booked">${icon('check')}Booked</span>`;
    if (b.status === 'waitlisted') return `<span class="chip chip-queue">${icon('queue')}${ordinal(b.waitlist_rank)} in line</span>`;
    if (b.status === 'attended') return `<span class="chip chip-quiet">${icon('check')}Attended</span>`;
    if (b.status === 'no_show') return `<span class="chip chip-quiet">${icon('stop')}No-show</span>`;
    if (b.status === 'late_cancelled') return `<span class="chip chip-quiet">${icon('stop')}Late cancel</span>`;
    return '';
  };
  const lateFor = (c) => c.my_booking && c.my_booking.status === 'confirmed' && c.can.cancel.allowed && c.can.cancel.late;

  function rowHTML(c) {
    const s = parts(c.starts_local), e = parts(c.ends_local);
    const muted = c.status === 'cancelled' || c.has_ended;
    const metaPlaces = c.status === 'cancelled' || c.has_ended
      ? `<span>${placesText(c)}</span>`
      : `${rail(c)}<span>${placesText(c)}</span>`;
    const late = lateFor(c) ? `<span class="warn">${icon('clock')}Free cancellation ended</span>` : '';
    const id = c.id;
    return `<li class="cls" data-id="${id}" data-muted="${muted}" data-lint-skip="measure">
      <button type="button" class="cls-row" id="r-${id}" aria-expanded="${open === id}" aria-controls="d-${id}">
        <span class="t"><time datetime="${c.starts_local}">${clock(s.h, s.mi)}</time><span class="t-end">to ${clock(e.h, e.mi)}</span></span>
        <span class="body"><span class="name">${esc(c.class_type.name)}</span>
          <span class="meta"><span>${esc(c.instructor.display_name)}</span>${metaPlaces}</span>
          ${chip(c) || late ? `<span class="status">${chip(c)}${late}</span>` : ''}</span>
        ${icon('down', 'chev')}
      </button>
      <div class="detail" id="d-${id}" role="region" aria-labelledby="r-${id}" ${open === id ? '' : 'hidden'}>${open === id ? detailHTML(c) : ''}</div>
    </li>`;
  }

  function detailHTML(c) {
    const tz = data.location.time_zone, today = data.period.today, b = c.my_booking;
    const facts = `<div class="facts">
        <div><strong>${dayLabel(c.starts_local.slice(0, 10))}, ${rangeLocal(c.starts_local, c.ends_local)}${NB}${zoneShort(tz)}</strong></div>
        <div>With ${esc(c.instructor.display_name)} at ${esc(data.location.name)}</div>
        ${c.status === 'scheduled' && !c.has_ended ? `<div>${rail(c, true)}<span><span data-num>${c.taken_count}</span> of ${c.capacity} places taken${c.waiting_count ? `, ${c.waiting_count}${NB}waiting` : ''}</span></div>` : ''}
      </div>`;
    let status = '', policy = '', actions = '';
    const btn = (kind, act, label, extra = '') => `<button type="button" class="btn btn-${kind}" data-act="${act}" data-id="${c.id}" ${extra}><span class="label">${label}</span><span class="spinner" aria-hidden="true"></span></button>`;
    const access = data.me.access;
    const blocked = (reason) => ({
      payment_past_due_grace_ended: 'Booking is paused until your payment goes through.',
      no_pass: 'You need a pass to book classes here.',
      no_credits_left: 'Your class pack has no classes left.'
    }[reason]);

    if (c.status === 'cancelled') {
      status = 'The gym cancelled this class.';
      policy = b ? `<p class="policy">${icon('info')}<span>Your booking was cancelled with it. Nothing counts against you.</span></p>` : '';
    } else if (c.has_ended) {
      status = b && b.status === 'attended' ? 'You attended this class.' : b && b.status === 'no_show' ? 'Marked as a no-show.' : 'This class has ended.';
    } else if (b && b.status === 'confirmed') {
      status = b.promoted ? 'You got a place from the waitlist.' : 'You’re booked.';
      if (c.can.cancel.late) {
        policy = `<p class="policy warn">${icon('clock')}<span>Free cancellation ended ${whenInZone(b.free_cancel_until, tz, today)}. Cancelling now counts as a no-show.</span></p>`;
        actions = btn('danger', 'cancel-late', 'Cancel anyway…');
      } else {
        policy = `<p class="policy">${icon('clock')}<span>Free cancellation until ${whenInZone(b.free_cancel_until, tz, today)}. After that, cancelling counts as a no-show.</span></p>`;
        actions = btn('secondary', 'cancel', 'Cancel booking');
      }
    } else if (b && b.status === 'waitlisted') {
      status = `You’re ${ordinal(b.waitlist_rank)} in line.`;
      policy = `<p class="policy">${icon('info')}<span>If a place opens before the class starts, it goes to the first person in line and the booking is made for you.</span></p>`;
      actions = btn('secondary', 'leave', 'Leave waitlist');
    } else if (c.can.book.allowed) {
      status = `${plural(c.places_left, 'place', 'places')} left.`;
      const deadline = c.free_cancel_until_if_booked;
      const past = new Date(deadline) <= new Date(data.summary.as_of);
      policy = past
        ? `<p class="policy warn">${icon('clock')}<span>Free cancellation for this class has ended. If you book, cancelling counts as a no-show.</span></p>`
        : `<p class="policy">${icon('clock')}<span>Free cancellation until ${whenInZone(deadline, tz, today)} if you book now.</span></p>`;
      actions = btn('primary', 'book', 'Book this class');
    } else if (c.can.join_waitlist.allowed) {
      status = c.waiting_count ? `Full. ${plural(c.waiting_count, 'person', 'people')} waiting.` : 'Full. Nobody is waiting yet.';
      policy = `<p class="policy">${icon('info')}<span>You’d be ${ordinal(c.can.join_waitlist.would_be_rank)} in line. If a place opens before the class starts, it’s booked for you, with free cancellation until 12 hours before the start, or until the start if the place opens later than that.</span></p>`;
      actions = btn('primary', 'join', 'Join waitlist');
    } else {
      const r = c.can.book.reason === 'class_full' ? c.can.join_waitlist.reason : c.can.book.reason;
      status = c.places_left > 0 && !c.waiting_count ? `${plural(c.places_left, 'place', 'places')} left.` : (c.waiting_count ? `Full. ${plural(c.waiting_count, 'person', 'people')} waiting.` : 'Full.');
      const msg = blocked(r) || (r === 'class_started' ? 'This class has started.' : 'You can’t book this class.');
      actions = `<button type="button" class="btn btn-primary" disabled aria-describedby="why-${c.id}"><span class="label">${c.places_left > 0 && !c.waiting_count ? 'Book this class' : 'Join waitlist'}</span></button><span class="reason" id="why-${c.id}">${msg}</span>`;
    }
    return `<div class="detail-inner">
      <p class="status-line" id="st-${c.id}" tabindex="-1">${status}</p>
      ${facts}${policy}
      ${actions ? `<div class="actions">${actions}</div>` : ''}
    </div>`;
  }

  function sideHTML() {
    const s = data.summary, a = data.me.access, tz = data.location.time_zone, today = data.period.today;
    const empty = s.class_count === 0;
    const wk = `<div class="week-card">
      <div class="week">
        <button type="button" class="icon-btn" data-week="${addDays(data.period.start_date, -7)}" aria-label="Previous week">${icon('left')}</button>
        <h2 id="week-label">${weekRange(data.period.start_date, data.period.end_date)}</h2>
        <button type="button" class="icon-btn" data-week="${addDays(data.period.start_date, 7)}" aria-label="Next week">${icon('right')}</button>
      </div>
      <p class="tz">Times are ${esc(data.location.name)} local time (${zoneShort(tz)})</p>
    </div>`;
    let mine = '';
    if (!empty) {
      const next = data.data.find((c) => c.my_booking && c.my_booking.status === 'confirmed' && !c.has_ended && c.status === 'scheduled');
      const n = next ? parts(next.starts_local) : null;
      const nextDay = next ? (next.starts_local.slice(0, 10) === today ? 'today' : dayLabel(next.starts_local.slice(0, 10))) : '';
      mine = `<section class="card" aria-labelledby="mine-h">
        <h2 id="mine-h">Your week at ${esc(data.location.name)}</h2>
        <div class="tallies">
          <p class="tally"><span class="n" data-num id="t-booked">${s.my_booked_count}</span><span class="l">${s.my_booked_count === 1 ? 'class booked' : 'classes booked'}</span></p>
          <p class="tally"><span class="n" data-num id="t-wait">${s.my_waitlisted_count}</span><span class="l">${s.my_waitlisted_count === 1 ? 'waitlist' : 'waitlists'}</span></p>
        </div>
        ${next ? `<p class="next"><span>Next: </span><a href="#r-${next.id}" data-open="${next.id}">${esc(next.class_type.name)}</a><span>, ${nextDay} at ${clock(n.h, n.mi)}</span></p>` : ''}
      </section>`;
    }
    const gym = data.location.gym.name;
    let passBody = '';
    if (a.status === 'active' && a.pass_kind === 'monthly') {
      const r = a.renews_at ? inZone(a.renews_at, tz) : null;
      passBody = `<p class="pass-name">Monthly pass</p><p>Unlimited classes at ${esc(gym)}${r ? `. Renews ${dayLabel(r.date)}.` : '.'}</p>`;
    } else if (a.status === 'active' && a.pass_kind === 'pack') {
      passBody = `<p class="pass-name">Class pack</p><p><span data-num>${a.credits_left}</span> ${a.credits_left === 1 ? 'class' : 'classes'} left at ${esc(gym)}.</p>`;
    } else if (a.status === 'grace') {
      passBody = `<p class="pass-name">Monthly pass</p><p class="pass-flag">${icon('alert')}<span>Payment failed. You can book until ${whenInZone(a.grace_ends_at, tz, today)}.</span></p>`;
    } else {
      passBody = `<p class="pass-name">${a.reason === 'payment_past_due_grace_ended' ? 'Monthly pass' : 'No pass'}</p><p class="pass-flag danger">${icon('stop')}<span>${a.reason === 'payment_past_due_grace_ended' ? 'Booking paused. Payment needed.' : `Buy a pass to book at ${esc(gym)}.`}</span></p>`;
    }
    const pass = `<section class="card pass" aria-labelledby="pass-h"><h2 id="pass-h">Your pass</h2>${passBody}</section>`;
    return { wk, mine, pass };
  }

  function bannerHTML() {
    const a = data.me.access, tz = data.location.time_zone, today = data.period.today;
    if (a.status === 'grace') return `<section class="banner" aria-labelledby="ban-h">${icon('alert')}
      <div><h2 id="ban-h">Your monthly pass payment didn’t go through</h2>
      <p>You can keep booking until ${whenInZone(a.grace_ends_at, tz, today)}. Update your card before then to keep your pass.</p></div>
      <div class="actions"><a class="btn btn-primary" href="#update-payment"><span class="label">Update payment</span></a></div></section>`;
    if (a.status === 'none' && a.reason === 'payment_past_due_grace_ended') return `<section class="banner danger" aria-labelledby="ban-h">${icon('stop')}
      <div><h2 id="ban-h">Booking is paused</h2>
      <p>Your monthly pass payment didn’t go through, and booking stayed open until ${whenInZone(a.grace_ends_at, tz, today)}. Update your card to book again. Classes you already booked stay booked.</p></div>
      <div class="actions"><a class="btn btn-primary" href="#update-payment"><span class="label">Update payment</span></a></div></section>`;
    return '';
  }

  function stripHTML() {
    let h = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(data.period.start_date, i);
      const mine = data.data.some((c) => c.starts_local.startsWith(d) && c.my_booking && ['confirmed', 'waitlisted', 'attended'].includes(c.my_booking.status) && c.status === 'scheduled');
      const has = data.data.some((c) => c.starts_local.startsWith(d));
      const extra = (d === data.period.today ? ', today' : '') + (mine ? ', you have a class' : '');
      h += `<a class="day-link" href="#day-${d}" data-mine="${mine}" ${d === data.period.today ? 'aria-current="date"' : ''} ${has ? '' : 'data-empty="true"'}>
        <span class="dn">${dateOnly(d, { weekday: 'short' })}</span><span class="dd">${Number(d.slice(8))}</span><span class="mark"></span>${extra ? `<span class="sr-only">${extra}</span>` : ''}</a>`;
    }
    return `<nav aria-label="Days of the week"><div class="days">${h}</div></nav>`;
  }

  function listHTML() {
    const s = data.summary;
    if (s.class_count === 0 && !data.data.length) {
      const nxt = s.next_week_with_classes;
      return `<section class="panel" aria-labelledby="empty-h">
        <span class="rail lg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <h2 id="empty-h">No classes at ${esc(data.location.name)} this week</h2>
        ${nxt ? `<p>The next classes here are in the week of ${dateOnly(nxt, { month: 'long', day: 'numeric' }).replace(' ', NB)}.</p>
          <button type="button" class="btn btn-primary" data-week="${nxt}"><span class="label">Show week of ${dateOnly(nxt, { month: 'short', day: 'numeric' }).replace(' ', NB)}</span></button>`
        : `<p>Nothing is scheduled after this week yet. New classes show up here as soon as the gym publishes them.</p>`}
      </section>`;
    }
    let h = bannerHTML() + stripHTML();
    h += `<p class="asof">Places as of <time datetime="${s.as_of}">${(() => { const z = inZone(s.as_of, data.location.time_zone); return clock(z.h, z.mi); })()}</time>${data.has_more ? '. Showing the first classes; more below.' : ''}</p>`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(data.period.start_date, i);
      const rows = data.data.filter((c) => c.starts_local.startsWith(d));
      h += `<section class="day" id="day-${d}" aria-labelledby="h-${d}">
        <div class="day-head"><h3 id="h-${d}">${dateOnly(d, { weekday: 'long', month: 'short', day: 'numeric' }).replace(/ (?=\d)/, NB)}</h3>${d === data.period.today ? '<span class="today-tag">Today</span>' : ''}</div>
        ${rows.length ? `<ul class="classes">${rows.map(rowHTML).join('')}</ul>` : '<p class="day-empty">No classes</p>'}
      </section>`;
    }
    if (data.has_more) h += `<button type="button" class="btn btn-secondary" data-more><span class="label">Load more classes</span></button>`;
    return h;
  }

  function loadingHTML() {
    const row = () => `<div class="sk-row"><span class="sk-stack"><span class="sk" style="height:12px;width:56px"></span><span class="sk" style="height:12px;width:40px"></span></span>
      <span class="sk-stack"><span class="sk" style="height:12px;width:60%"></span><span class="sk" style="height:12px;width:40%"></span></span></div>`;
    let h = '';
    for (let i = 0; i < 3; i++) h += `<div class="day"><div class="day-head"><span class="sk" style="height:12px;width:96px"></span></div><div class="classes">${row()}${row()}</div></div>`;
    return h;
  }

  function render() {
    const root = document.documentElement;
    $('#avatar').textContent = me.profile.display_name.split(' ').map((w) => w[0]).join('').slice(0, 2);
    $('#avatar').setAttribute('aria-label', `Signed in as ${me.profile.display_name}`);
    if (STATE === 'loading') {
      root.dataset.data = 'none';
      $('#where').textContent = 'Basalt Climbing, Eastside';
      $('#week').innerHTML = `<div class="week-card"><div class="week"><span class="sk" style="height:44px;width:44px"></span><span class="sk" style="height:12px;width:96px;margin:auto"></span><span class="sk" style="height:44px;width:44px"></span></div></div>`;
      $('#mine').innerHTML = ''; $('#pass').innerHTML = '';
      $('#list').setAttribute('aria-busy', 'true');
      $('#list').innerHTML = loadingHTML();
      $('#live').textContent = 'Loading the schedule';
      return;
    }
    if (STATE === 'error') {
      root.dataset.data = 'none';
      $('#where').textContent = 'Basalt Climbing, Eastside';
      $('#week').innerHTML = ''; $('#mine').innerHTML = ''; $('#pass').innerHTML = '';
      $('#list').innerHTML = `<section class="panel" aria-labelledby="err-h">
        <h2 id="err-h">The schedule didn’t load</h2>
        <p>We couldn’t reach Crux. Check your connection, then try again. Your bookings are not affected.</p>
        <button type="button" class="btn btn-primary" data-retry><span class="label">Try again</span><span class="spinner" aria-hidden="true"></span></button>
      </section>`;
      return;
    }
    $('#list').removeAttribute('aria-busy');
    if (data.summary.class_count === 0 && !data.data.length) root.dataset.data = 'none'; else delete root.dataset.data;
    $('#where').textContent = `${data.location.gym.name}, ${data.location.name}`;
    document.title = `Schedule, ${data.location.name} · Crux`;
    const sd = sideHTML(); $('#week').innerHTML = sd.wk; $('#mine').innerHTML = sd.mine; $('#pass').innerHTML = sd.pass;
    $('#list').innerHTML = listHTML();
  }

  function fillPlaces() {
    const sel = $('#loc');
    sel.innerHTML = me.gyms.map((g) => `<optgroup label="${esc(g.name)}">${g.locations.map((l) => `<option value="${l.id}">${esc(g.name)}, ${esc(l.name)}</option>`).join('')}</optgroup>`).join('');
    if (data) sel.value = data.location.id;
    sel.addEventListener('change', () => go(sel.value, data ? data.period.start_date : '2026-10-12'));
  }

  function go(locId, week) {
    const next = WEEKS[keyFor(locId, week)];
    const sel = $('#loc');
    if (!next && data && locId !== data.location.id) {
      // GET /v1/locations/{id}/schedule answers 404 not_found when the caller can no longer see that wall (membership ended).
      sel.setAttribute('aria-invalid', 'true'); sel.setAttribute('aria-describedby', 'loc-err');
      $('#loc-err-text').textContent = 'That wall isn’t available to you any more. Pick another.'; $('#loc-err').hidden = false; sel.focus(); return;
    }
    if (!next) { $('#live').textContent = 'That week is not in this prototype’s data.'; return; }
    sel.removeAttribute('aria-invalid'); sel.removeAttribute('aria-describedby'); $('#loc-err').hidden = true;
    data = structuredClone(next); open = null; render();
    $('#live').textContent = `Showing ${data.location.name}, ${weekRange(data.period.start_date, data.period.end_date)}`;
    $('#loc').value = locId;
  }

  // ---------- Actions: the page applies the API's documented response (api.md) to its copy of the week ----------
  const findC = (id) => data.data.find((c) => c.id === id);
  function recount() {
    data.summary.my_booked_count = data.data.filter((c) => c.my_booking && ['confirmed', 'attended', 'no_show'].includes(c.my_booking.status)).length;
    data.summary.my_waitlisted_count = data.data.filter((c) => c.my_booking && c.my_booking.status === 'waitlisted').length;
  }
  function apply(act, c) {
    const rank = c.waiting_count + 1;
    if (act === 'book') {
      c.taken_count++; c.places_left--; c.my_booking = { id: crypto.randomUUID(), status: 'confirmed', waitlist_rank: null, promoted: false, free_cancel_until: c.free_cancel_until_if_booked, cancel_reason: null };
      c.can.book = { allowed: false, reason: 'already_booked' }; c.can.join_waitlist = { allowed: false, reason: 'already_booked' };
      c.can.cancel = { allowed: true, late: new Date(data.summary.as_of) >= new Date(c.free_cancel_until_if_booked) }; return 'Booked. You have a place.';
    }
    if (act === 'join') {
      c.waiting_count++; c.my_booking = { id: crypto.randomUUID(), status: 'waitlisted', waitlist_rank: rank, promoted: false, free_cancel_until: null, cancel_reason: null };
      c.can.book = { allowed: false, reason: 'already_booked' }; c.can.join_waitlist = { allowed: false, reason: 'already_booked' };
      c.can.leave_waitlist = { allowed: true }; return `You joined the waitlist. You’re ${ordinal(rank)} in line.`;
    }
    if (act === 'leave') {
      c.waiting_count--; c.my_booking = null; c.can.leave_waitlist = { allowed: false, reason: 'not_waitlisted' };
      c.can.book = c.places_left > 0 && c.waiting_count === 0 ? { allowed: true } : { allowed: false, reason: 'class_full' };
      c.can.join_waitlist = c.can.book.allowed ? { allowed: false, reason: 'places_available' } : { allowed: true, would_be_rank: c.waiting_count + 1 };
      return 'You left the waitlist.';
    }
    if (act === 'cancel' || act === 'cancel-late') {
      // The freed place goes to the first person waiting, in the same transaction (schema.sql, api.cancel_booking).
      if (c.waiting_count > 0) c.waiting_count--; else { c.taken_count--; c.places_left++; }
      c.my_booking = null; c.can.cancel = { allowed: false, reason: 'no_booking' };
      c.can.book = c.places_left > 0 && c.waiting_count === 0 ? { allowed: true } : { allowed: false, reason: 'class_full' };
      c.can.join_waitlist = c.can.book.allowed ? { allowed: false, reason: 'places_available' } : { allowed: true, would_be_rank: c.waiting_count + 1 };
      return act === 'cancel-late' ? 'Booking cancelled. It counts as a no-show.' : 'Booking cancelled. Nothing counts against you.';
    }
  }
  const latency = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--duration-base')) * 3;
  function run(button, act, id) {
    const c = findC(id);
    button.setAttribute('aria-busy', 'true'); button.disabled = true;
    setTimeout(() => {
      const msg = apply(act, c); recount(); open = id; render();
      const st = document.getElementById('st-' + id); if (st) st.focus();
      $('#live').textContent = msg;
    }, latency());
  }

  document.addEventListener('click', (e) => {
    const row = e.target.closest('.cls-row');
    if (row) { const id = row.closest('.cls').dataset.id; open = open === id ? null : id; render(); document.getElementById('r-' + id).focus(); return; }
    const jump = e.target.closest('[data-open]');
    if (jump) { e.preventDefault(); open = jump.dataset.open; render(); const r = document.getElementById('r-' + open); r.scrollIntoView({ block: 'start' }); r.focus(); return; }
    const wk = e.target.closest('[data-week]');
    if (wk) { go(data.location.id, wk.dataset.week); return; }
    const a = e.target.closest('[data-act]');
    if (a) {
      if (a.dataset.act === 'cancel-late') return openLate(findC(a.dataset.id), a);
      return run(a, a.dataset.act, a.dataset.id);
    }
    if (e.target.closest('[data-retry]')) { location.search = ''; }
  });

  const dlg = $('#late-dialog');
  let lateCtx = null;
  function openLate(c, trigger) {
    lateCtx = { c, trigger };
    const tz = data.location.time_zone;
    $('#late-body').textContent = `Free cancellation for ${c.class_type.name} ended ${whenInZone(c.my_booking.free_cancel_until, tz, data.period.today).replace(/ /g, ' ')}. If you cancel now, your place goes to the next person in line and this counts as a no-show.`;
    dlg.showModal();
  }
  $('#late-keep').addEventListener('click', () => dlg.close());
  dlg.addEventListener('close', () => { if (lateCtx && lateCtx.trigger.isConnected) lateCtx.trigger.focus(); });
  $('#late-confirm').addEventListener('click', (e) => {
    const b = e.currentTarget; b.setAttribute('aria-busy', 'true'); b.disabled = true;
    setTimeout(() => {
      const id = lateCtx.c.id; const msg = apply('cancel-late', lateCtx.c); recount();
      b.removeAttribute('aria-busy'); b.disabled = false; dlg.close(); open = id; render();
      const st = document.getElementById('st-' + id); if (st) st.focus(); $('#live').textContent = msg;
    }, latency());
  });

  // ---------- Boot ----------
  if (STATE !== 'loading' && STATE !== 'error') {
    data = pick();
    const suffix = FOCUS[STATE];
    if (suffix) open = data.data.find((c) => c.id.endsWith(suffix)).id;
  }
  fillPlaces();
  render();
  if (STATE === 'late-cancel-confirm') { const c = findC(open); openLate(c, document.querySelector(`[data-act="cancel-late"]`)); }
})();
</script>
</body>
</html>
